<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프리미엄 다기능 스톱워치</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Fira Code 폰트 추가 로드 (숫자용) */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Montserrat:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Fira+Code:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s;
        }

        /* 커스텀 스크롤바 디자인 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: rgba(0, 0, 0, 0.2);
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* --- 반응형 스케일링 핵심 --- */
        #scalableWrapper {
            font-size: 16px; /* 기본 크기 */
        }

        /* --- 스타일별 테마 디자인 --- */

        /* 1. 럭셔리 (Luxury) */
        .style-luxury-light {
            background: linear-gradient(135deg, #ffffff 0%, #f0f2f5 100%);
            box-shadow: 0.5em 0.5em 1.5em #d1d1d1, -0.5em -0.5em 1.5em #ffffff;
            color: #2c3e50;
        }
        .style-luxury-dark {
            background: linear-gradient(135deg, #2d3436 0%, #000000 100%);
            box-shadow: 0.5em 0.5em 1.5em #0a0a0a, -0.5em -0.5em 1.5em #383838;
            color: #dfe6e9;
        }
        .text-luxury-num { 
            font-family: 'Fira Code', monospace; 
            font-variant-numeric: tabular-nums; 
            font-feature-settings: "tnum";
            letter-spacing: -0.05em;
        }
        
        /* 2. 모던 (Modern) */
        .style-modern-light {
            background-color: #ffffff;
            border: 0.15em solid #1a1a1a;
            box-shadow: 0.3em 0.3em 0px rgba(0,0,0,0.05);
            color: #1a1a1a;
        }
        .style-modern-dark {
            background-color: #1a1a1a;
            border: 0.15em solid #ffffff;
            box-shadow: 0.3em 0.3em 0px rgba(255,255,255,0.1);
            color: #ffffff;
        }
        .text-modern-num { 
            font-family: 'Fira Code', monospace; 
            font-weight: 600; 
            font-variant-numeric: tabular-nums; 
            font-feature-settings: "tnum";
            letter-spacing: -0.05em;
        }

        /* 유틸리티 */
        .btn-press:active { transform: scale(0.95); }
        
        /* 강조 애니메이션 */
        @keyframes flashHighlight {
            0% { background-color: rgba(59, 130, 246, 0.3); transform: scale(0.98); }
            100% { background-color: transparent; transform: scale(1); }
        }
        .animate-flash {
            animation: flashHighlight 0.5s ease-out;
        }

        /* 모달 스타일 */
        #settingsModal { transition: opacity 0.3s ease, visibility 0.3s; }
        #settingsModal.hidden-modal { opacity: 0; visibility: hidden; pointer-events: none; }
        #settingsModal.visible-modal { opacity: 1; visibility: visible; pointer-events: auto; }
        #modalContent { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .hidden-modal #modalContent { transform: scale(0.9) translateY(10px); }
        .visible-modal #modalContent { transform: scale(1) translateY(0); }
    </style>
</head>
<body id="body" class="bg-white text-gray-800 h-screen flex flex-col items-center justify-center overflow-hidden transition-colors duration-500 relative">

    <!-- 우측 상단 컨트롤 패널 -->
    <div class="absolute top-6 right-6 z-20 flex flex-col gap-3">
        <!-- 설정 버튼 -->
        <button onclick="toggleModal()" class="w-12 h-12 rounded-full bg-white/80 dark:bg-gray-800/80 backdrop-blur-sm shadow-lg hover:scale-105 transition-all flex items-center justify-center btn-press focus:outline-none ring-1 ring-gray-100 dark:ring-gray-700" title="설정">
            <i class="fas fa-sliders-h text-xl text-gray-600 dark:text-gray-300"></i>
        </button>

        <!-- 크기 조절 버튼 그룹 -->
        <div class="flex flex-col gap-2 bg-white/80 dark:bg-gray-800/80 backdrop-blur-sm rounded-full p-1.5 shadow-lg ring-1 ring-gray-100 dark:ring-gray-700">
            <button onclick="adjustScale(0.2)" class="w-9 h-9 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors flex items-center justify-center text-gray-600 dark:text-gray-300 btn-press" title="크기 확대">
                <i class="fas fa-plus"></i>
            </button>
            <button onclick="adjustScale(-0.2)" class="w-9 h-9 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors flex items-center justify-center text-gray-600 dark:text-gray-300 btn-press" title="크기 축소">
                <i class="fas fa-minus"></i>
            </button>
        </div>
    </div>

    <!-- 메인 스톱워치 컨테이너 (스케일링 래퍼) -->
    <div id="scalableWrapper" class="flex items-center justify-center p-4 transition-all duration-300">
        
        <div id="stopwatchContainer" class="relative rounded-[2em] transition-all duration-500 flex flex-col items-center p-[2.5em] style-luxury-light" style="width: 34em; height: 38em;">
            
            <!-- 시간 디스플레이 -->
            <div class="flex items-baseline justify-center mb-[2em] w-full gap-[0.2em]">
                <!-- 분:초 -->
                <div id="mainTimeDisplay" class="font-bold leading-none tracking-tight transition-all duration-200 text-luxury-num" style="font-size: 6.5em;">00:00</div>
                <!-- 밀리초 -->
                <div id="subTimeDisplay" class="font-medium opacity-60 leading-none transition-all duration-200 text-luxury-num" style="font-size: 3.5em;">.00</div>
            </div>

            <!-- 컨트롤 버튼 -->
            <div class="flex gap-[2em] z-10 items-center justify-center mb-[2em] w-full">
                
                <!-- 왼쪽 버튼: 랩(Lap) 또는 리셋(Reset) -->
                <button onclick="handleLeftBtn()" id="btnLeft" class="rounded-full flex items-center justify-center border border-current opacity-60 hover:opacity-100 hover:bg-black/5 dark:hover:bg-white/10 transition btn-press disabled:opacity-30" style="width: 4.5em; height: 4.5em; font-size: 1em;">
                    <span id="txtLeft" class="font-bold" style="font-size: 0.9em;">구간</span>
                </button>
                
                <!-- 중앙 버튼: 시작/정지 -->
                <button onclick="toggleStartStop()" id="btnMain" class="rounded-full flex items-center justify-center shadow-xl hover:shadow-2xl hover:scale-105 transition btn-press bg-gray-900 text-white dark:bg-white dark:text-gray-900" style="width: 6em; height: 6em;">
                    <i id="iconMain" class="fas fa-play" style="font-size: 2.5em;"></i>
                </button>
                
                <!-- 오른쪽: 빈 공간 균형용 (비활성) -->
                 <div style="width: 4.5em; height: 4.5em;"></div>
            </div>

            <!-- 랩 타임 리스트 -->
            <div class="w-full flex-1 overflow-hidden relative border-t border-gray-200 dark:border-gray-700 pt-[0.5em]">
                
                <!-- 커스텀 스크롤바 적용 -->
                <div id="lapList" class="w-full h-full overflow-y-auto custom-scrollbar flex flex-col items-center px-[0.5em]">
                    <div class="text-[0.8em] opacity-40 mt-[2em]">기록 대기 중</div>
                </div>
                
            </div>

        </div>
    </div>

    <!-- 설정 팝업 모달 -->
    <div id="settingsModal" class="fixed inset-0 z-30 flex items-center justify-center bg-black/30 backdrop-blur-sm hidden-modal">
        <div class="absolute inset-0" onclick="closeModal()"></div>
        <div id="modalContent" class="relative bg-white dark:bg-gray-900 w-80 rounded-3xl shadow-2xl p-6 ring-1 ring-gray-100 dark:ring-gray-700">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold text-gray-800 dark:text-white">설정</h2>
                <button onclick="closeModal()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <i class="fas fa-times text-gray-500 dark:text-gray-400"></i>
                </button>
            </div>

            <div class="mb-6">
                <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-3 uppercase tracking-wider">테마 모드</p>
                <div class="flex bg-gray-100 dark:bg-gray-800 p-1 rounded-xl">
                    <button onclick="setTheme(false)" id="btn-theme-light" class="flex-1 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center justify-center gap-2">
                        <i class="fas fa-sun text-amber-500"></i> 라이트
                    </button>
                    <button onclick="setTheme(true)" id="btn-theme-dark" class="flex-1 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center justify-center gap-2">
                        <i class="fas fa-moon text-indigo-400"></i> 다크
                    </button>
                </div>
            </div>

            <div>
                <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-3 uppercase tracking-wider">디자인 스타일</p>
                <div class="space-y-2">
                    <button onclick="changeStyle('luxury')" id="btn-style-luxury" class="w-full flex items-center justify-between p-3 rounded-xl border border-gray-200 dark:border-gray-700 hover:border-amber-500 transition-all group">
                        <span class="text-sm font-serif italic font-bold text-gray-700 dark:text-gray-300">Luxury</span>
                        <i class="fas fa-check text-amber-500 opacity-0 group-[.active]:opacity-100"></i>
                    </button>
                    <button onclick="changeStyle('modern')" id="btn-style-modern" class="w-full flex items-center justify-between p-3 rounded-xl border border-gray-200 dark:border-gray-700 hover:border-rose-500 transition-all group">
                        <span class="text-sm font-sans font-black text-gray-700 dark:text-gray-300 tracking-tighter">MODERN</span>
                        <i class="fas fa-check text-rose-500 opacity-0 group-[.active]:opacity-100"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 상태 변수
        let isDark = false;
        let currentStyle = 'luxury'; 
        let currentScale = 1.0; 
        const baseSizePx = 16; 

        // 스톱워치 변수
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;
        let isRunning = false;
        let laps = [];

        // DOM 요소
        const scalableWrapper = document.getElementById('scalableWrapper');
        const stopwatchContainer = document.getElementById('stopwatchContainer');
        const mainTimeDisplay = document.getElementById('mainTimeDisplay');
        const subTimeDisplay = document.getElementById('subTimeDisplay');
        const lapList = document.getElementById('lapList');
        
        const btnMain = document.getElementById('btnMain');
        const iconMain = document.getElementById('iconMain');
        const btnLeft = document.getElementById('btnLeft');
        const txtLeft = document.getElementById('txtLeft');

        // 초기화
        window.onload = () => {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                setTheme(true);
            } else {
                updateUI();
            }
            adjustScale(0.2); 
            updateButtonState();
        };

        // --- 크기 조절 ---
        function adjustScale(delta) {
            currentScale += delta;
            if (currentScale < 0.6) currentScale = 0.6;
            if (currentScale > 3.2) currentScale = 3.2; 
            scalableWrapper.style.fontSize = `${baseSizePx * currentScale}px`;
        }

        // --- 스톱워치 로직 ---

        function toggleStartStop() {
            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
            } else {
                startTime = Date.now() - elapsedTime;
                timerInterval = setInterval(updateTime, 10);
                isRunning = true;
            }
            updateButtonState();
        }

        function updateTime() {
            const now = Date.now();
            elapsedTime = now - startTime;
            renderTime(elapsedTime);
        }

        function renderTime(msTime) {
            const totalSeconds = Math.floor(msTime / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const centiseconds = Math.floor((msTime % 1000) / 10);

            const mStr = minutes.toString().padStart(2, '0');
            const sStr = seconds.toString().padStart(2, '0');
            const cStr = centiseconds.toString().padStart(2, '0');

            mainTimeDisplay.innerText = `${mStr}:${sStr}`;
            subTimeDisplay.innerText = `.${cStr}`;
        }

        function handleLeftBtn() {
            if (isRunning) {
                recordLap();
            } else {
                resetStopwatch();
            }
        }

        function recordLap() {
            const currentLapTime = elapsedTime;
            laps.unshift(currentLapTime);
            renderLaps();
            
            // 스크롤을 맨 위로 이동하여 최신 기록 보여줌
            lapList.scrollTop = 0;
        }

        function resetStopwatch() {
            clearInterval(timerInterval);
            isRunning = false;
            elapsedTime = 0;
            startTime = 0;
            laps = [];
            renderTime(0);
            renderLaps();
            updateButtonState();
        }

        function renderLaps() {
            lapList.innerHTML = '';
            
            if (laps.length === 0) {
                lapList.innerHTML = '<div class="text-[0.8em] opacity-40 mt-[2em]">기록 대기 중</div>';
                return;
            }

            laps.forEach((time, index) => {
                const lapNum = laps.length - index;
                
                const totalSeconds = Math.floor(time / 1000);
                const m = Math.floor(totalSeconds / 60);
                const s = totalSeconds % 60;
                const cs = Math.floor((time % 1000) / 10);
                
                const timeStr = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}.${cs.toString().padStart(2, '0')}`;

                const row = document.createElement('div');
                // 가독성 개선: 글자색을 진하게 설정 (text-gray-700 / gray-200)
                row.className = "flex justify-between items-center w-full px-[1.5em] py-[0.6em] border-b border-gray-100 dark:border-gray-800 text-[0.9em] rounded-lg mb-1";
                
                // 최신 기록 강조 (반짝임 애니메이션 + 굵기)
                if (index === 0) {
                     row.classList.add('font-bold', 'text-gray-900', 'dark:text-white', 'animate-flash');
                } else {
                     row.classList.add('text-gray-700', 'dark:text-gray-300');
                }

                const fontClass = 'font-mono';

                row.innerHTML = `
                    <span class="font-medium">구간 ${lapNum.toString().padStart(2, '0')}</span>
                    <span class="${fontClass} text-[1.1em] tracking-tight">${timeStr}</span>
                `;
                lapList.appendChild(row);
            });
        }

        function updateButtonState() {
            if (isRunning) {
                iconMain.className = "fas fa-pause";
                btnLeft.disabled = false;
                txtLeft.innerText = "구간";
                btnLeft.classList.remove('opacity-30');
            } else {
                iconMain.className = "fas fa-play";
                
                if (elapsedTime > 0) {
                    btnLeft.disabled = false;
                    txtLeft.innerText = "초기화";
                    btnLeft.classList.remove('opacity-30');
                } else {
                    btnLeft.disabled = true;
                    txtLeft.innerText = "구간";
                    btnLeft.classList.add('opacity-30');
                }
            }
            adjustIconColor();
        }
        
        function adjustIconColor() {
            if (isDark) {
                iconMain.parentElement.classList.remove('text-white', 'bg-gray-900');
                iconMain.parentElement.classList.add('bg-white', 'text-gray-900');
            } else {
                iconMain.parentElement.classList.remove('bg-white', 'text-gray-900');
                iconMain.parentElement.classList.add('text-white', 'bg-gray-900');
            }
        }

        // --- 테마 & 스타일 로직 ---

        function toggleModal() {
            const modal = document.getElementById('settingsModal');
            if (modal.classList.contains('hidden-modal')) {
                modal.classList.remove('hidden-modal');
                modal.classList.add('visible-modal');
            } else {
                closeModal();
            }
        }

        function closeModal() {
            const modal = document.getElementById('settingsModal');
            modal.classList.remove('visible-modal');
            modal.classList.add('hidden-modal');
        }

        function setTheme(dark) {
            isDark = dark;
            if (isDark) {
                body.classList.add('dark');
                body.classList.remove('bg-white', 'text-gray-800');
                body.classList.add('bg-gray-900', 'text-gray-100');
            } else {
                body.classList.remove('dark');
                body.classList.remove('bg-gray-900', 'text-gray-100');
                body.classList.add('bg-white', 'text-gray-800');
            }
            updateUI();
            adjustIconColor();
        }

        function changeStyle(styleName) {
            currentStyle = styleName;
            updateUI();
            renderLaps();
        }

        function updateUI() {
            stopwatchContainer.className = "relative rounded-[2em] transition-all duration-500 flex flex-col items-center p-[2.5em]";
            
            const timeDisplays = [mainTimeDisplay, subTimeDisplay];
            timeDisplays.forEach(el => el.classList.remove('text-luxury-num', 'text-modern-num'));
            
            if (currentStyle === 'luxury') {
                stopwatchContainer.classList.add(isDark ? 'style-luxury-dark' : 'style-luxury-light');
                timeDisplays.forEach(el => el.classList.add('text-luxury-num'));
            } else if (currentStyle === 'modern') {
                stopwatchContainer.classList.add(isDark ? 'style-modern-dark' : 'style-modern-light');
                timeDisplays.forEach(el => el.classList.add('text-modern-num'));
            }

            updateModalUI();
        }

        function updateModalUI() {
            const btnLight = document.getElementById('btn-theme-light');
            const btnDark = document.getElementById('btn-theme-dark');
            
            const inactiveClass = "flex-1 py-2 rounded-lg text-sm font-medium text-gray-500 transition-all duration-200 flex items-center justify-center gap-2 hover:bg-gray-200/50";
            const activeClass = "flex-1 py-2 rounded-lg text-sm font-bold bg-white text-gray-900 shadow-sm transition-all duration-200 flex items-center justify-center gap-2";

            if (isDark) {
                btnLight.className = inactiveClass;
                btnDark.className = activeClass;
            } else {
                btnLight.className = activeClass;
                btnDark.className = inactiveClass;
            }

            ['luxury', 'modern'].forEach(style => {
                const btn = document.getElementById(`btn-style-${style}`);
                if (style === currentStyle) {
                    btn.classList.add('active', 'border-indigo-500', 'bg-indigo-50', 'dark:bg-indigo-900/30', 'dark:border-indigo-500');
                    btn.classList.remove('border-gray-200', 'dark:border-gray-700');
                } else {
                    btn.classList.remove('active', 'border-indigo-500', 'bg-indigo-50', 'dark:bg-indigo-900/30', 'dark:border-indigo-500');
                    btn.classList.add('border-gray-200', 'dark:border-gray-700');
                }
            });
        }
    </script>
</body>
</html>
