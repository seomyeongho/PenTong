<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다이나믹 동물 100m 올림픽</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap');
        
        body {
            font-family: 'Jua', sans-serif;
            background-color: #2c3e50;
            overflow: hidden; /* 전체 스크롤 방지 */
        }

        .font-black-han {
            font-family: 'Black Han Sans', sans-serif;
        }

        /* 끝없이 이어지는 트랙 배경 */
        .track-bg {
            background-color: #4CAF50;
            background-image: 
                linear-gradient(90deg, transparent 98%, rgba(255,255,255,0.4) 98%), /* 세로줄 (트랙 라인) */
                linear-gradient(0deg, transparent 95%, rgba(0,0,0,0.05) 95%); /* 가로줄 (질감) */
            background-size: 200px 100%, 100% 20px; /* 200px 간격으로 라인 */
        }

        .finish-line {
            background: repeating-linear-gradient(
                45deg,
                #000,
                #000 20px,
                #fff 20px,
                #fff 40px
            );
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* 애니메이션 */
        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.05); }
        }
        .running-motion {
            animation: bounce 0.4s infinite;
        }
        
        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg); }
            75% { transform: rotate(15deg); }
        }
        .stumble-motion {
            animation: shake 0.5s infinite;
            filter: grayscale(100%);
            opacity: 0.8;
        }

        .boost-effect::after {
            content: '🔥';
            position: absolute;
            left: -30px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2rem;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: translateY(-50%) scale(1); }
            50% { opacity: 0.5; transform: translateY(-50%) scale(0.8); }
        }

        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            z-index: 100;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }
    </style>
</head>
<body class="flex flex-col h-screen text-gray-100">

    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-600 to-indigo-700 p-4 shadow-xl z-20 flex-none flex justify-between items-center px-8 border-b-4 border-indigo-800">
        <h1 class="text-2xl md:text-4xl text-white font-black-han tracking-wider drop-shadow-[0_2px_2px_rgba(0,0,0,0.5)] italic transform -skew-x-6">
            🏃‍♂️ 스펙터클 레이스 🏃‍♀️
        </h1>
        <div class="hidden md:block text-yellow-300 font-bold text-lg animate-pulse">
            LIVE 🔴
        </div>
    </header>

    <!-- Main Game Area -->
    <main class="flex-grow flex flex-col relative overflow-hidden bg-gray-800">
        
        <!-- Setup Screen -->
        <div id="setup-screen" class="absolute inset-0 z-40 bg-gray-900 flex flex-col items-center justify-center p-4 transition-transform duration-500 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
            <div class="bg-white text-gray-800 rounded-3xl p-8 w-full max-w-2xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] border-4 border-blue-500">
                <h2 class="text-3xl text-center mb-8 text-blue-800 font-black-han">선수 등록</h2>
                
                <div class="flex gap-3 mb-6">
                    <!-- 글자수 제한 maxlength="5" 추가 -->
                    <input type="text" id="player-input" 
                        class="flex-grow border-2 border-blue-200 bg-blue-50 rounded-2xl px-6 py-4 focus:outline-none focus:border-blue-500 text-xl shadow-inner transition placeholder-gray-400 font-bold" 
                        placeholder="이름 (최대 5글자)" 
                        maxlength="5"
                        onkeypress="handleKeyPress(event)">
                    <button onclick="addPlayer()" 
                        class="bg-blue-600 hover:bg-blue-700 text-white rounded-2xl px-8 text-xl font-bold shadow-lg active:scale-95 transition border-b-4 border-blue-800">
                        추가
                    </button>
                </div>
                <p class="text-gray-400 text-sm text-center mb-2">* 이름은 최대 5글자까지 입력 가능합니다.</p>

                <div id="player-list" class="flex flex-wrap gap-3 mb-8 h-40 overflow-y-auto p-4 bg-gray-100 rounded-2xl border border-gray-200 shadow-inner content-start">
                    <div class="text-gray-400 text-center w-full py-10 text-lg">참가할 선수를 등록해주세요!</div>
                </div>

                <div class="flex gap-4">
                    <button onclick="clearPlayers()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-600 py-4 rounded-2xl font-bold text-lg transition border-b-4 border-gray-400">
                        초기화
                    </button>
                    <button onclick="prepareRace()" id="start-btn" class="flex-[2] bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white text-2xl rounded-2xl py-4 font-black-han shadow-lg transform transition border-b-4 border-green-800 disabled:opacity-50 disabled:cursor-not-allowed disabled:border-none" disabled>
                        경기장 입장!
                    </button>
                </div>
            </div>
        </div>

        <!-- Race Screen (Camera View) -->
        <div id="race-screen" class="flex-grow relative overflow-hidden hidden bg-[#4CAF50]">
            
            <!-- Distance Markers (Fixed Overlay) -->
            <div class="absolute top-0 left-0 w-full h-8 bg-black/20 z-10 flex items-center px-4 backdrop-blur-sm border-b border-white/10">
                 <div id="distance-display" class="text-white font-mono font-bold text-shadow">
                    선두 거리: 0m
                 </div>
            </div>

            <!-- The World (Scrolls horizontally) -->
            <!-- Width will be set dynamically in JS to be very long -->
            <div id="world-container" class="absolute top-0 bottom-0 left-0 track-bg transition-transform duration-100 ease-linear flex flex-col justify-center py-10" style="width: 10000px; transform: translate3d(0px, 0, 0);">
                
                <!-- Start Line -->
                <div class="absolute top-0 bottom-0 w-2 bg-white left-[100px] z-0 flex items-center justify-center">
                    <span class="text-white font-black text-6xl opacity-50 -rotate-90 whitespace-nowrap">START</span>
                </div>

                <!-- Finish Line -->
                <div class="absolute top-0 bottom-0 w-16 finish-line z-0 flex items-center justify-center" style="left: 9500px;">
                     <span class="text-white bg-black/50 px-2 font-black text-4xl -rotate-90 whitespace-nowrap backdrop-blur-md">FINISH</span>
                </div>

                <!-- Lanes Container -->
                <div id="lanes-area" class="w-full flex flex-col gap-4">
                    <!-- Lanes generated by JS -->
                </div>
            </div>

            <!-- Commentary Box (Fixed at bottom) -->
            <div class="absolute bottom-0 left-0 w-full h-28 bg-gradient-to-t from-black via-black/90 to-transparent flex flex-col justify-center items-center p-4 z-30">
                <div id="commentary-text" class="text-yellow-400 text-2xl md:text-3xl font-black-han animate-pulse text-center drop-shadow-md px-4 py-2 rounded-xl bg-black/40 backdrop-blur-md border border-yellow-500/30">
                    선수들이 몸을 풀고 있습니다...
                </div>
                <div class="text-gray-400 text-xs mt-2 bg-black/50 px-3 py-1 rounded-full uppercase tracking-widest border border-gray-700">Live Commentary</div>
            </div>
        </div>

        <!-- Countdown Overlay -->
        <div id="countdown-overlay" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center">
            <div id="countdown-text" class="text-[12rem] font-black text-white drop-shadow-[0_0_50px_rgba(255,255,255,0.5)] animate-bounce italic">
                3
            </div>
        </div>

    </main>

    <!-- Winner Modal -->
    <div id="winner-modal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center z-50 backdrop-blur-md p-4">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-lg w-full text-center shadow-[0_0_100px_rgba(255,215,0,0.3)] transform scale-0 transition-all duration-500 border-8 border-yellow-400 relative overflow-hidden" id="winner-content">
            
            <!-- Confetti Background inside modal -->
            <div class="absolute inset-0 bg-[radial-gradient(#ffd700_1px,transparent_1px)] [background-size:16px_16px] opacity-20"></div>

            <div class="relative z-10">
                <div class="text-7xl mb-4 animate-bounce">🏆</div>
                <h2 class="text-5xl font-black-han text-gray-900 mb-2 tracking-tight">경기 종료!</h2>
                <div class="text-xl text-gray-500 mb-8 font-medium">치열한 접전이었습니다</div>

                <!-- Winner Highlight -->
                <div class="bg-gradient-to-br from-yellow-100 to-orange-100 rounded-3xl p-6 mb-8 border-4 border-yellow-300 shadow-xl transform rotate-1 hover:rotate-0 transition-transform">
                    <div class="text-sm text-yellow-800 font-black tracking-[0.3em] mb-2 uppercase">Winner</div>
                    <div id="winner-name" class="text-5xl font-black text-gray-900 break-keep drop-shadow-sm leading-tight"></div>
                </div>

                <!-- Rank List -->
                <div class="bg-gray-50 rounded-2xl p-1 mb-8 border border-gray-200 shadow-inner max-h-48 overflow-y-auto custom-scrollbar">
                    <div id="rank-list" class="divide-y divide-gray-200">
                        <!-- Rank Items -->
                    </div>
                </div>

                <div class="flex gap-4">
                    <button onclick="resetGame()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-4 rounded-2xl font-bold text-lg transition">
                        처음으로
                    </button>
                    <button onclick="restartRace()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-bold text-lg shadow-lg transition border-b-4 border-blue-800 active:border-b-0 active:translate-y-1">
                        다시 하기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Game Configuration ---
        const WORLD_WIDTH = 10000; // 10,000px virtual distance (approx 100m feel)
        const START_POS = 100;
        const FINISH_POS = 9500;
        const FPS = 30;
        const TARGET_DURATION_SEC = 25; // Target race time ~25-30s
        // Calculate speed per frame to hit target duration
        // Distance = 9400px. Frames = 30 * 25 = 750. Speed/Frame = 12.5 px.
        const BASE_SPEED = (FINISH_POS - START_POS) / (TARGET_DURATION_SEC * FPS); 

        // --- Data ---
        let players = [];
        const emojis = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🦄', '🦖', '🐙', '🐢', '🐆'];
        
        let isRacing = false;
        let raceInterval;
        let finishedPlayers = [];
        let playerStates = [];
        let raceTimer = 0;

        // --- DOM Elements ---
        const playerInput = document.getElementById('player-input');
        const playerList = document.getElementById('player-list');
        const startBtn = document.getElementById('start-btn');
        const setupScreen = document.getElementById('setup-screen');
        const raceScreen = document.getElementById('race-screen');
        const worldContainer = document.getElementById('world-container');
        const lanesArea = document.getElementById('lanes-area');
        const distanceDisplay = document.getElementById('distance-display');
        const commentaryText = document.getElementById('commentary-text');
        
        const winnerModal = document.getElementById('winner-modal');
        const winnerContent = document.getElementById('winner-content');
        const winnerNameEl = document.getElementById('winner-name');
        const rankListEl = document.getElementById('rank-list');

        // --- Commentary Data ---
        const comments = {
            start: ["출발했습니다!", "총성이 울렸습니다!", "힘찬 스타트!", "일제히 튀어나갑니다!"],
            boost: ["갑자기 속도를 냅니다!", "엄청난 스퍼트!", "부스터 가동!", "폭발적인 질주!", "보이지 않을 정도로 빠릅니다!"],
            stumble: ["어이쿠! 삐끗합니다.", "잠시 주춤하네요.", "넘어질 뻔 했습니다!", "체력이 떨어졌나요?", "딴청을 피웁니다."],
            lead: ["단독 선두!", "가장 앞서 나갑니다!", "우승 후보인가요?", "거리를 벌립니다!"],
            catchup: ["바짝 추격합니다!", "격차가 줄어듭니다!", "뒤따라 잡습니다!"],
            finish: ["결승선 통과!", "들어왔습니다!", "레이스 종료!"]
        };

        // --- Setup Logic ---
        function handleKeyPress(event) {
            if (event.key === 'Enter') addPlayer();
        }

        function addPlayer() {
            const name = playerInput.value.trim();
            if (!name) return;
            // Additional check if html maxlength is bypassed
            if (name.length > 5) {
                alert("이름은 5글자까지만 가능합니다!");
                return;
            }
            if (players.includes(name)) {
                alert('이미 등록된 선수입니다!');
                return;
            }
            players.push(name);
            renderPlayerList();
            playerInput.value = '';
            playerInput.focus();
            updateStartButton();
        }

        function removePlayer(index) {
            players.splice(index, 1);
            renderPlayerList();
            updateStartButton();
        }

        function clearPlayers() {
            players = [];
            renderPlayerList();
            updateStartButton();
        }

        function renderPlayerList() {
            playerList.innerHTML = '';
            if (players.length === 0) {
                playerList.innerHTML = '<div class="text-gray-400 text-center w-full py-10 text-lg">참가할 선수를 등록해주세요!</div>';
                return;
            }
            players.forEach((player, index) => {
                const chip = document.createElement('div');
                chip.className = 'bg-white border-2 border-blue-200 text-blue-800 px-4 py-2 rounded-xl flex items-center gap-2 shadow-sm font-bold animate-[fadeIn_0.2s_ease-in-out] text-lg';
                chip.innerHTML = `
                    <span>${index + 1}. ${player}</span>
                    <button onclick="removePlayer(${index})" class="ml-2 bg-red-100 text-red-500 rounded-full w-6 h-6 flex items-center justify-center hover:bg-red-500 hover:text-white transition text-sm">×</button>
                `;
                playerList.appendChild(chip);
            });
        }

        function updateStartButton() {
            startBtn.disabled = players.length < 2;
        }

        // --- Race Logic ---
        function prepareRace() {
            setupScreen.style.transform = 'translateY(-100%)';
            raceScreen.classList.remove('hidden');
            
            lanesArea.innerHTML = '';
            
            // Initialize Player States
            playerStates = players.map((name, index) => ({
                name: name,
                emoji: emojis[index % emojis.length],
                currentPos: START_POS,
                speed: 0,
                state: 'run', // run, boost, stumble, finish
                laneId: `lane-${index}`,
                runnerId: `runner-${index}`,
                rank: 0
            }));

            // Build Lanes
            playerStates.forEach((p) => {
                const lane = document.createElement('div');
                lane.className = 'relative h-24 border-b border-white/10 w-full';
                lane.id = p.laneId;
                
                // Runner
                // Added will-change-transform and precise styling to minimize jitter
                lane.innerHTML = `
                    <div id="${p.runnerId}" class="absolute top-1/2 -translate-y-1/2 flex flex-col items-center will-change-transform z-10" style="left: 0px; transform: translate3d(${START_POS}px, 0, 0); width: 100px;">
                        <!-- Name Tag (Increased visibility) -->
                        <div class="bg-black/80 text-white text-base px-2 py-1 rounded-lg mb-1 whitespace-nowrap backdrop-blur-md border border-white/30 shadow-lg font-black tracking-wide" style="text-shadow: 1px 1px 2px black;">
                            ${p.name}
                        </div>
                        <!-- Emoji -->
                        <div class="text-6xl emoji-char filter drop-shadow-2xl relative select-none transition-transform">
                            ${p.emoji}
                        </div>
                    </div>
                `;
                lanesArea.appendChild(lane);
            });

            startCountdown();
        }

        function startCountdown() {
            const overlay = document.getElementById('countdown-overlay');
            const text = document.getElementById('countdown-text');
            overlay.classList.remove('hidden');
            
            let count = 3;
            text.innerText = count;
            text.className = "text-[12rem] font-black text-white drop-shadow-[0_0_50px_rgba(255,255,255,0.5)] animate-bounce italic";

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    text.innerText = count;
                    text.style.animation = 'none';
                    text.offsetHeight; /* trigger reflow */
                    text.style.animation = null; 
                } else if (count === 0) {
                    text.innerText = "GO!!";
                    text.className = "text-[12rem] font-black text-yellow-400 drop-shadow-[0_0_50px_rgba(255,215,0,0.8)] animate-ping italic";
                } else {
                    clearInterval(timer);
                    overlay.classList.add('hidden');
                    runRace();
                }
            }, 800);
        }

        function runRace() {
            isRacing = true;
            finishedPlayers = [];
            raceTimer = 0;
            triggerComment(comments.start);
            
            raceInterval = setInterval(gameLoop, 1000 / FPS);
        }

        function gameLoop() {
            if (!isRacing) return;
            raceTimer++;

            let leadingPos = 0;
            let leadingPlayerName = "";
            let activeRunners = 0;

            playerStates.forEach(p => {
                if (p.state === 'finish') return;
                activeRunners++;

                // 1. Determine State (Random Events)
                const roll = Math.random();
                
                if (p.state === 'boost' && Math.random() < 0.1) p.state = 'run';
                if (p.state === 'stumble' && Math.random() < 0.05) p.state = 'run';

                if (p.state === 'run') {
                    if (roll < 0.005) { // 0.5% chance boost
                        p.state = 'boost';
                        if (Math.random() < 0.3) triggerComment(comments.boost, p.name);
                    } else if (roll > 0.995) { // 0.5% chance stumble
                        p.state = 'stumble';
                        if (Math.random() < 0.3) triggerComment(comments.stumble, p.name);
                    }
                }

                // 2. Calculate Speed
                let currentSpeed = BASE_SPEED * (0.8 + Math.random() * 0.4);

                if (p.state === 'boost') currentSpeed *= 2.0;
                if (p.state === 'stumble') currentSpeed *= 0.2;

                if (leadingPos > 0 && p.currentPos < leadingPos - 1000) {
                    currentSpeed *= 1.3;
                }

                // 3. Move Logic
                p.currentPos += currentSpeed;

                // 4. Update Leader
                if (p.currentPos > leadingPos) {
                    leadingPos = p.currentPos;
                    leadingPlayerName = p.name;
                }

                // 5. Update DOM with Integer Rounding for sharp text
                const runnerEl = document.getElementById(p.runnerId);
                const drawPos = Math.round(p.currentPos - START_POS); // Rounding prevents sub-pixel jitter
                runnerEl.style.transform = `translate3d(${drawPos}px, 0, 0)`; // translate3d forces GPU and usually snaps better
                
                // Update Classes
                const emojiEl = runnerEl.querySelector('.emoji-char');
                emojiEl.className = 'text-6xl emoji-char filter drop-shadow-2xl relative select-none transition-transform'; 
                
                // Only animate the emoji, keeping the name stable
                if (p.state === 'run' || p.state === 'boost') emojiEl.classList.add('running-motion');
                if (p.state === 'boost') emojiEl.classList.add('boost-effect');
                if (p.state === 'stumble') emojiEl.classList.add('stumble-motion');

                // 6. Finish Check
                if (p.currentPos >= FINISH_POS) {
                    p.currentPos = FINISH_POS;
                    p.state = 'finish';
                    finishedPlayers.push(p.name);
                    
                    emojiEl.classList.remove('running-motion', 'boost-effect', 'stumble-motion');
                    createConfetti(runnerEl);
                }
            });

            // Camera Follow Logic with Integer Rounding
            const viewportWidth = raceScreen.clientWidth;
            let targetScroll = leadingPos - (viewportWidth * 0.6);
            if (targetScroll < 0) targetScroll = 0;
            if (targetScroll > (WORLD_WIDTH - viewportWidth)) targetScroll = WORLD_WIDTH - viewportWidth;

            const drawScroll = Math.round(-targetScroll); // Rounding for camera
            worldContainer.style.transform = `translate3d(${drawScroll}px, 0, 0)`;

            // Distance UI
            const meters = Math.floor((leadingPos - START_POS) / (FINISH_POS - START_POS) * 100);
            distanceDisplay.innerText = `선두: ${meters}m / ${leadingPlayerName}`;

            // End Race Check
            if (activeRunners === 0) {
                endRace();
            }
        }

        function endRace() {
            clearInterval(raceInterval);
            isRacing = false;
            triggerComment(comments.finish);
            setTimeout(showWinnerModal, 1500);
        }

        // --- Utils & UI ---
        function triggerComment(commentArray, playerName = "") {
            const text = commentArray[Math.floor(Math.random() * commentArray.length)];
            const fullText = playerName ? `${playerName}, ${text}` : text;
            
            commentaryText.innerText = fullText;
            commentaryText.classList.remove('animate-pulse');
            void commentaryText.offsetWidth;
            commentaryText.classList.add('animate-pulse');
        }

        function createConfetti(element) {
            const rect = element.getBoundingClientRect();
            // Simple DOM confetti
            for(let i=0; i<20; i++) {
                const conf = document.createElement('div');
                conf.innerText = ['✨','🎉','🎊'][Math.floor(Math.random()*3)];
                conf.style.position = 'fixed';
                conf.style.left = rect.left + 'px';
                conf.style.top = rect.top + 'px';
                conf.style.fontSize = '20px';
                conf.style.pointerEvents = 'none';
                conf.style.zIndex = 100;
                conf.animate([
                    { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
                    { transform: `translate(${Math.random()*200-100}px, ${Math.random()*200-100}px) rotate(${Math.random()*360}deg)`, opacity: 0 }
                ], {
                    duration: 1000,
                    easing: 'ease-out'
                }).onfinish = () => conf.remove();
                document.body.appendChild(conf);
            }
        }

        function showWinnerModal() {
            const winner = finishedPlayers[0];
            winnerNameEl.innerText = winner; // Ensure plain text
            winnerNameEl.style.color = "#1f2937"; // Force dark color (gray-900)

            // Generate Rank List
            rankListEl.innerHTML = finishedPlayers.map((name, i) => {
                let rankClass = "bg-white";
                let badge = `<span class="bg-gray-200 text-gray-600 w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm">${i+1}</span>`;
                
                if (i === 0) {
                    rankClass = "bg-yellow-50 border-yellow-200";
                    badge = `<span class="bg-yellow-400 text-yellow-900 w-8 h-8 rounded-full flex items-center justify-center font-bold text-lg shadow-sm">🥇</span>`;
                } else if (i === 1) {
                    badge = `<span class="bg-gray-300 text-gray-800 w-8 h-8 rounded-full flex items-center justify-center font-bold text-lg shadow-sm">🥈</span>`;
                } else if (i === 2) {
                    badge = `<span class="bg-orange-300 text-orange-900 w-8 h-8 rounded-full flex items-center justify-center font-bold text-lg shadow-sm">🥉</span>`;
                }

                // Explicitly setting text color to black/gray-800 to fix "invisible text" issue
                return `
                    <div class="flex items-center justify-between p-4 ${rankClass} hover:bg-gray-100 transition border-b last:border-0 border-gray-100">
                        <div class="flex items-center gap-4">
                            ${badge}
                            <span class="font-bold text-gray-800 text-lg">${name}</span>
                        </div>
                        ${i === 0 ? '<span class="text-xs font-bold text-yellow-600 bg-yellow-100 px-2 py-1 rounded-md">WINNER</span>' : ''}
                    </div>
                `;
            }).join('');

            winnerModal.classList.remove('hidden');
            setTimeout(() => {
                winnerContent.classList.remove('scale-0');
                winnerContent.classList.add('scale-100');
                fireConfettiFull();
            }, 50);
        }

        function fireConfettiFull() {
            const colors = ['#fcd34d', '#f87171', '#60a5fa', '#34d399', '#a78bfa'];
            for (let i = 0; i < 150; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.top = '-20px';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 5000);
            }
        }

        function restartRace() {
            closeModal();
            prepareRace();
        }

        function resetGame() {
            closeModal();
            raceScreen.classList.add('hidden');
            setupScreen.style.transform = 'translateY(0)';
            // Setup screen is back
        }

        function closeModal() {
            winnerContent.classList.remove('scale-100');
            winnerContent.classList.add('scale-0');
            setTimeout(() => {
                winnerModal.classList.add('hidden');
            }, 300);
        }
    </script>
</body>
</html>
