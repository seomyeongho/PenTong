<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디지털 시계</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Orbitron:wght@400;700&family=Playfair+Display:wght@400;700&display=swap');

        body {
            font-family: 'Montserrat', sans-serif;
            transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s;
        }

        /* --- 스타일별 배경 및 효과 --- */

        /* 럭셔리 (Luxury) */
        .style-luxury-light {
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            box-shadow: 20px 20px 60px #d1d1d1, -20px -20px 60px #ffffff;
            border-radius: 2.5rem;
        }

        .style-luxury-dark {
            background: linear-gradient(145deg, #2a2a2a, #1f1f1f);
            box-shadow: 20px 20px 50px #151515, -20px -20px 50px #333333;
            border-radius: 2.5rem;
        }

        /* 모던 (Modern) */
        .style-modern-light {
            background-color: #f3f4f6;
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.25);
            border-radius: 2.5rem;
            border: 8px solid #111;
        }

        .style-modern-dark {
            background-color: #111;
            box-shadow: 0 20px 50px -12px rgba(255, 255, 255, 0.1);
            border-radius: 2.5rem;
            border: 8px solid #eee;
        }

        /* 사이버 (Cyber) */
        .style-cyber {
            background: radial-gradient(circle at center, #0f172a 0%, #000000 100%);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.2), inset 0 0 50px rgba(6, 182, 212, 0.1);
            border-radius: 2.5rem;
            border: 2px solid rgba(6, 182, 212, 0.5);
        }

        /* --- 디지털 텍스트 스타일 --- */
        .text-luxury {
            font-family: 'Playfair Display', serif;
        }
        
        .text-modern {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
        }

        .text-cyber {
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.8), 0 0 20px rgba(6, 182, 212, 0.4);
        }

        /* --- 시계 숫자 요동 방지용 고정 너비 박스 --- */
        .digit-box {
            display: inline-block;
            text-align: center;
        }
        
        /* 테마 폰트별 숫자 너비 최적화 (겹침 및 여백 방지) */
        .text-luxury .digit-box { width: 1.4em; }
        .text-modern .digit-box { width: 1.55em; }
        .text-cyber .digit-box { width: 1.6em; }

        .colon {
            display: inline-block;
            text-align: center;
        }

        /* 테마 폰트별 콜론 크기 및 위치 최적화 */
        .text-luxury .colon {
            width: 0.3em;
            font-size: 0.65em; /* 럭셔리 폰트 콜론 크기 대폭 축소 */
            transform: translateY(-0.05em);
        }
        .text-modern .colon {
            width: 0.3em;
            transform: translateY(-0.05em);
        }
        .text-cyber .colon {
            width: 0.4em;
            transform: translateY(-0.05em);
        }

        .ampm-box {
            display: inline-block;
            width: 2.2em; /* 고정 rem 대신 em 단위로 변경하여 글자 크기에 비례하게 설정 */
            text-align: left;
            padding-left: 0.25em;
        }

        /* --- 설정 사이드바 애니메이션 및 레이아웃 --- */
        #settingsSidebar {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), margin-right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            width: 20rem; /* 320px */
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            z-index: 30;
        }

            #settingsSidebar.closed {
                transform: translateX(100%);
            }

            #settingsSidebar.open {
                transform: translateX(0);
            }

        /* PC/태블릿 환경에서는 밀어내기(Push) 방식으로 시계를 가리지 않음 */
        @media (min-width: 768px) {
            #settingsSidebar {
                position: relative;
            }

                #settingsSidebar.closed {
                    transform: translateX(0);
                    margin-right: -20rem;
                }

                #settingsSidebar.open {
                    transform: translateX(0);
                    margin-right: 0;
                }
        }
    </style>
</head>
<body id="body" class="bg-gray-50 text-gray-800 h-screen w-screen overflow-hidden selection:bg-indigo-500 selection:text-white transition-colors duration-500">

    <div class="flex w-full h-full relative">
        <!-- 메인 시계 영역 -->
        <div class="flex-1 h-full flex items-center justify-center relative transition-all duration-400">
            <!-- 상단 설정 버튼 -->
            <div class="absolute top-6 right-6 z-20">
                <button id="settingsBtn" onclick="toggleSettings()" class="w-12 h-12 rounded-full bg-white/80 dark:bg-gray-800/80 backdrop-blur-sm shadow-lg hover:scale-105 transition-all flex items-center justify-center focus:outline-none ring-1 ring-gray-200 dark:ring-gray-700 active:scale-95" title="설정">
                    <i class="fas fa-sliders-h text-xl text-gray-600 dark:text-gray-300"></i>
                </button>
            </div>

            <!-- 시계 컨테이너 (너비와 높이 대폭 확장) -->
            <div id="clockWrapper" class="relative w-[24rem] h-60 md:w-[46rem] md:h-[24rem] transition-all duration-500 flex items-center justify-center style-luxury-light group cursor-pointer" onclick="toggleSettings()">
                <!-- 디지털 시계 요소 -->
                <div id="clockContent" class="flex flex-col items-center justify-center transition-transform duration-500 group-hover:scale-[1.02] w-full h-full rounded-[2.5rem]">
                    <div id="dateText" class="text-base md:text-xl mb-4 opacity-75 tracking-widest"></div>
                    <div class="flex items-baseline justify-center space-x-2">
                        <!-- 숫자 흔들림 방지를 위해 요소를 개별 분리 & 폰트 크기 확대 -->
                        <div class="text-[3.5rem] md:text-[6.5rem] tabular-nums tracking-wide leading-none flex items-center justify-center">
                            <span id="hourText" class="digit-box"></span>
                            <span class="colon opacity-70">:</span>
                            <span id="minuteText" class="digit-box"></span>
                            <span class="colon opacity-70">:</span>
                            <span id="secondText" class="digit-box"></span>
                        </div>
                        <div id="ampmText" class="text-2xl md:text-4xl font-bold opacity-80 ampm-box"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 우측 설정 사이드바 패널 -->
        <div id="settingsSidebar" class="closed bg-white/95 dark:bg-gray-900/95 backdrop-blur-xl border-l border-gray-200 dark:border-gray-800 shadow-2xl flex-shrink-0 flex flex-col">
            <div class="p-6 h-full overflow-y-auto">
                <!-- 모달 헤더 -->
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-gray-800 dark:text-white">설정</h2>
                    <button onclick="toggleSettings()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                        <i class="fas fa-times text-gray-500 dark:text-gray-400"></i>
                    </button>
                </div>

                <!-- 섹션 1: 시간 형식 -->
                <div class="mb-6">
                    <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-3 uppercase tracking-wider">시간 형식</p>
                    <div class="flex bg-gray-100 dark:bg-gray-800 p-1 rounded-xl">
                        <button onclick="setTimeFormat(12)" id="btn-format-12" class="flex-1 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center justify-center gap-2">
                            12시간
                        </button>
                        <button onclick="setTimeFormat(24)" id="btn-format-24" class="flex-1 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center justify-center gap-2">
                            24시간
                        </button>
                    </div>
                </div>

                <!-- 섹션 2: 테마 -->
                <div class="mb-6">
                    <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-3 uppercase tracking-wider">테마 모드</p>
                    <div class="flex bg-gray-100 dark:bg-gray-800 p-1 rounded-xl">
                        <button onclick="setTheme(false)" id="btn-theme-light" class="flex-1 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center justify-center gap-2">
                            <i class="fas fa-sun text-amber-500"></i> 라이트
                        </button>
                        <button onclick="setTheme(true)" id="btn-theme-dark" class="flex-1 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center justify-center gap-2">
                            <i class="fas fa-moon text-indigo-400"></i> 다크
                        </button>
                    </div>
                </div>

                <!-- 섹션 3: 시계 디자인 -->
                <div>
                    <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-3 uppercase tracking-wider">시계 디자인</p>
                    <div class="space-y-2">
                        <button onclick="changeStyle('luxury')" id="btn-style-luxury" class="w-full flex items-center justify-between p-3 rounded-xl border border-gray-200 dark:border-gray-700 hover:border-amber-500 dark:hover:border-amber-500 hover:bg-amber-50 dark:hover:bg-gray-800 transition-all group">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-gray-100 to-gray-300 shadow-sm border border-gray-300 flex items-center justify-center">
                                    <span class="font-serif text-xs font-bold text-gray-700">12</span>
                                </div>
                                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Luxury</span>
                            </div>
                            <i class="fas fa-check text-amber-500 opacity-0 group-[.active]:opacity-100"></i>
                        </button>

                        <button onclick="changeStyle('modern')" id="btn-style-modern" class="w-full flex items-center justify-between p-3 rounded-xl border border-gray-200 dark:border-gray-700 hover:border-rose-500 dark:hover:border-rose-500 hover:bg-rose-50 dark:hover:bg-gray-800 transition-all group">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-white border-4 border-gray-900 shadow-sm flex items-center justify-center">
                                    <span class="font-sans text-[10px] font-bold text-gray-900">12</span>
                                </div>
                                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Modern</span>
                            </div>
                            <i class="fas fa-check text-rose-500 opacity-0 group-[.active]:opacity-100"></i>
                        </button>

                        <button onclick="changeStyle('cyber')" id="btn-style-cyber" class="w-full flex items-center justify-between p-3 rounded-xl border border-gray-200 dark:border-gray-700 hover:border-cyan-500 dark:hover:border-cyan-500 hover:bg-cyan-50 dark:hover:bg-gray-800 transition-all group">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-black border border-cyan-500 shadow-[0_0_5px_rgba(6,182,212,0.5)] flex items-center justify-center">
                                    <span class="font-sans text-[10px] text-cyan-400" style="font-family: 'Orbitron'">12</span>
                                </div>
                                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Cyber</span>
                            </div>
                            <i class="fas fa-check text-cyan-500 opacity-0 group-[.active]:opacity-100"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById('clockWrapper');
        const clockContent = document.getElementById('clockContent');
        
        // 개별 시간 박스 요소 가져오기
        const hourText = document.getElementById('hourText');
        const minuteText = document.getElementById('minuteText');
        const secondText = document.getElementById('secondText');
        const ampmText = document.getElementById('ampmText');
        const dateText = document.getElementById('dateText');

        let isDark = false;
        let is24Hour = false; // 기본 12시간제
        let currentStyle = 'luxury'; // 'luxury', 'modern', 'cyber'

        // --- 초기화 ---
        window.onload = () => {
            setTheme(false); // 초기 라이트 모드
            updateClock();
            setInterval(updateClock, 1000); // 1초마다 시계 업데이트
        };

        // --- 시계 업데이트 로직 ---
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            let ampm = '';

            if (!is24Hour) {
                ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12; // 0시는 12시로 표시
                ampmText.style.display = 'inline-block'; // AM/PM 표시
            } else {
                ampmText.style.display = 'none'; // 24시간 모드일 때는 AM/PM 숨김 (정중앙 위치 보정용)
            }
            
            hours = String(hours).padStart(2, '0');

            // 텍스트 길이 변경에 따른 요동(Jittering) 방지를 위해 각각 값을 설정
            hourText.innerText = hours;
            minuteText.innerText = minutes;
            secondText.innerText = seconds;
            ampmText.innerText = ampm;

            // 날짜 포맷팅 (예: 2026년 4월 16일 목요일)
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' };
            dateText.innerText = now.toLocaleDateString('ko-KR', options);
        }

        // --- 사이드바 설정 토글 로직 ---
        function toggleSettings() {
            const sidebar = document.getElementById('settingsSidebar');
            if (sidebar.classList.contains('closed')) {
                sidebar.classList.remove('closed');
                sidebar.classList.add('open');
            } else {
                sidebar.classList.remove('open');
                sidebar.classList.add('closed');
            }
        }

        // 배경 여백 클릭 시 설정창 닫기 로직
        document.addEventListener('click', function(event) {
            const sidebar = document.getElementById('settingsSidebar');
            const clockWrapper = document.getElementById('clockWrapper');
            const settingsBtn = document.getElementById('settingsBtn');

            // 사이드바가 열려있을 때
            if (sidebar.classList.contains('open')) {
                // 클릭한 영역이 사이드바, 시계 본체, 톱니바퀴 버튼이 아닐 경우에만 닫기
                if (!sidebar.contains(event.target) && !clockWrapper.contains(event.target) && !settingsBtn.contains(event.target)) {
                    sidebar.classList.remove('open');
                    sidebar.classList.add('closed');
                }
            }
        });

        // --- 시간 형식 로직 ---
        function setTimeFormat(format) {
            is24Hour = format === 24;
            updateUI();
            updateClock(); // 즉시 시간 반영
        }

        // --- 테마 로직 ---
        function setTheme(dark) {
            isDark = dark;
            const body = document.getElementById('body');

            if (isDark) {
                body.classList.add('dark');
                body.classList.remove('bg-gray-50', 'text-gray-800');
                body.classList.add('bg-gray-900', 'text-gray-100');
            } else {
                body.classList.remove('dark');
                body.classList.remove('bg-gray-900', 'text-gray-100');
                body.classList.add('bg-gray-50', 'text-gray-800');
            }
            updateUI();
        }

        // --- 스타일 로직 ---
        function changeStyle(styleName) {
            currentStyle = styleName;
            updateUI();
        }

        // --- UI 업데이트 (통합) ---
        function updateUI() {
            updateWrapperStyle();
            updateModalUI();
        }

        function updateWrapperStyle() {
            // 초기화 (자바스크립트에서도 늘어난 크기 반영)
            wrapper.className = "relative w-[24rem] h-60 md:w-[46rem] md:h-[24rem] transition-all duration-500 flex items-center justify-center group cursor-pointer";
            clockContent.className = "flex flex-col items-center justify-center transition-transform duration-500 group-hover:scale-[1.02] w-full h-full rounded-[2.5rem]";

            // 테마별 클래스 적용
            if (currentStyle === 'luxury') {
                wrapper.classList.add(isDark ? 'style-luxury-dark' : 'style-luxury-light');
                clockContent.classList.add('text-luxury');
                clockContent.classList.add(isDark ? 'text-gray-200' : 'text-gray-800');
            } else if (currentStyle === 'modern') {
                wrapper.classList.add(isDark ? 'style-modern-dark' : 'style-modern-light');
                clockContent.classList.add('text-modern');
                clockContent.classList.add(isDark ? 'text-white' : 'text-black');
            } else if (currentStyle === 'cyber') {
                wrapper.classList.add('style-cyber');
                clockContent.classList.add('text-cyber');
                clockContent.classList.add('text-cyan-400');
            }
        }

        function updateModalUI() {
            const activeClass = "flex-1 py-2 rounded-lg text-sm font-bold bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm transition-all duration-200 flex items-center justify-center gap-2";
            const inactiveClass = "flex-1 py-2 rounded-lg text-sm font-medium text-gray-500 dark:text-gray-400 transition-all duration-200 flex items-center justify-center gap-2 hover:bg-gray-200/50 dark:hover:bg-gray-700/50";

            // 시간 형식 버튼 상태
            const btn12 = document.getElementById('btn-format-12');
            const btn24 = document.getElementById('btn-format-24');
            btn12.className = !is24Hour ? activeClass : inactiveClass;
            btn24.className = is24Hour ? activeClass : inactiveClass;

            // 테마 버튼 상태
            const btnLight = document.getElementById('btn-theme-light');
            const btnDark = document.getElementById('btn-theme-dark');
            btnLight.className = !isDark ? activeClass : inactiveClass;
            btnDark.className = isDark ? activeClass : inactiveClass;

            // 스타일 버튼 상태
            ['luxury', 'modern', 'cyber'].forEach(style => {
                const btn = document.getElementById(`btn-style-${style}`);
                if (style === currentStyle) {
                    btn.classList.add('active', 'border-indigo-500', 'bg-indigo-50', 'dark:bg-indigo-900/30', 'dark:border-indigo-500');
                    btn.classList.remove('border-gray-200', 'dark:border-gray-700');
                } else {
                    btn.classList.remove('active', 'border-indigo-500', 'bg-indigo-50', 'dark:bg-indigo-900/30', 'dark:border-indigo-500');
                    btn.classList.add('border-gray-200', 'dark:border-gray-700');
                }
            });
        }
    </script>
</body>
</html>
