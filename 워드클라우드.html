<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>워드 클라우드 생성기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- WordCloud2.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
    
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            width: 24px; height: 24px; border-radius: 50%;
            border-left-color: #3b82f6;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Modal Animation */
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: opacity 0.2s, transform 0.2s ease-out; }
    </style>
</head>
<body class="h-screen w-full flex flex-col text-slate-800">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shrink-0">
        <h1 class="text-xl font-bold flex items-center gap-2 text-slate-700">
            <i class="fa-solid fa-cloud text-blue-500"></i> 워드 클라우드 생성기
        </h1>
        <div class="flex gap-3">
            <button onclick="copyImage()" id="btn-copy" class="hidden bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                <i class="fa-solid fa-copy"></i> 이미지 복사
            </button>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-1 flex overflow-hidden p-4 gap-4">
        
        <!-- Step 1: Input & Options (Left Panel) -->
        <section class="glass-panel w-1/3 min-w-[300px] flex flex-col rounded-xl overflow-hidden shrink-0">
            <div class="bg-slate-50 border-b border-slate-200 px-4 py-3 font-semibold text-slate-700 flex items-center gap-2">
                <span class="bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full text-xs">1단계</span> 데이터 입력
            </div>
            
            <div class="p-4 flex-1 flex flex-col gap-4 overflow-y-auto">
                <!-- Text Input Area -->
                <div id="area-text" class="flex-1 flex flex-col min-h-[200px]">
                    <div class="flex justify-end mb-1">
                        <button onclick="loadSampleData()" class="text-xs text-blue-500 hover:text-blue-700 font-medium px-2 py-1 rounded hover:bg-blue-50 transition-colors">
                            <i class="fa-solid fa-flask"></i> 샘플 데이터 로드
                        </button>
                    </div>
                    <textarea id="input-text" class="flex-1 w-full border border-slate-300 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none" placeholder="여기에 텍스트(엑셀에서 복사한 내용 등)를 직접 붙여넣기 하세요..."></textarea>
                </div>

                <!-- Options -->
                <div class="border-t border-slate-200 pt-4 mt-2">
                    <h3 class="text-sm font-semibold text-slate-600 mb-3">추출 옵션</h3>
                    
                    <label class="flex items-center gap-2 mb-1 cursor-pointer">
                        <input type="checkbox" id="opt-exclude-particles" checked class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500">
                        <span class="text-sm text-slate-700">조사/어미 제외 (명사 위주 추출)</span>
                    </label>
                    <p class="text-xs text-slate-400 ml-6">모든 단어를 넉넉히 추출한 뒤 다음 단계에서 편집합니다.</p>
                </div>

                <button onclick="extractKeywords()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-sm font-semibold transition-colors mt-auto flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> 키워드 추출
                </button>
            </div>
        </section>

        <!-- Step 2: Edit Keywords (Middle Panel) -->
        <section id="panel-edit" class="glass-panel w-1/4 min-w-[260px] flex flex-col rounded-xl overflow-hidden shrink-0 hidden">
            <div class="bg-slate-50 border-b border-slate-200 px-4 py-3 font-semibold text-slate-700 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full text-xs">2단계</span> 키워드 편집
                </div>
                <span id="keyword-count-badge" class="text-xs text-slate-500 font-normal">0개 대기중</span>
            </div>
            
            <div class="p-0 flex-1 overflow-y-auto">
                <table class="w-full text-sm text-left table-fixed">
                    <thead class="text-xs text-slate-500 bg-slate-50 sticky top-0 shadow-sm z-10">
                        <tr>
                            <th class="px-3 py-2 font-medium">단어 수정</th>
                            <th class="px-2 py-2 font-medium w-16 text-center">빈도수</th>
                            <th class="px-2 py-2 font-medium w-10 text-center">삭제</th>
                        </tr>
                    </thead>
                    <tbody id="keyword-list-body" class="divide-y divide-slate-100">
                        <!-- Keywords will be injected here -->
                    </tbody>
                </table>
            </div>

            <!-- Appearance Settings -->
            <div class="p-4 border-t border-slate-200 bg-slate-50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                <div class="mb-3">
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-xs text-slate-600 font-semibold">표시할 키워드 수</label>
                        <span class="text-[10px] text-slate-400">빈도수 상위 기준</span>
                    </div>
                    <input type="number" id="opt-max-words" value="100" min="5" max="500" class="w-full border border-slate-300 rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 bg-white shadow-inner">
                </div>
                <div class="mb-3">
                    <label class="block text-xs text-slate-500 mb-1">색상 테마</label>
                    <select id="opt-theme" class="w-full border border-slate-300 rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 bg-white">
                        <option value="colorful">다채로운 색상</option>
                        <option value="blue">푸른 바다</option>
                        <option value="warm">따뜻한 노을</option>
                        <option value="monochrome">무채색</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="block text-xs text-slate-500 mb-1">모양</label>
                    <select id="opt-shape" class="w-full border border-slate-300 rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 bg-white">
                        <option value="circle">원형 (Circle)</option>
                        <option value="cardioid">하트형 (Cardioid)</option>
                        <option value="diamond">다이아몬드 (Diamond)</option>
                        <option value="triangle-forward">삼각형 (Triangle)</option>
                    </select>
                </div>
                
                <!-- 추가된 기능: 배경색 설정 (여백 입력은 제거) -->
                <div class="mb-4">
                    <label class="block text-xs text-slate-500 mb-1">배경색</label>
                    <input type="color" id="opt-bg-color" value="#ffffff" class="w-full h-[30px] border border-slate-300 rounded cursor-pointer p-0" onchange="document.getElementById('canvas-container').style.backgroundColor = this.value">
                </div>

                <button onclick="generateWordCloud()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg text-sm font-semibold transition-colors flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play"></i> 클라우드 생성
                </button>
            </div>
        </section>

        <!-- Step 3: Canvas (Right Panel) -->
        <section id="panel-canvas" class="glass-panel flex-1 flex flex-col rounded-xl overflow-hidden relative">
            <div class="bg-slate-50 border-b border-slate-200 px-4 py-3 font-semibold text-slate-700 flex items-center gap-2">
                <span class="bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full text-xs">3단계</span> 결과 확인
            </div>
            
            <!-- 캔버스 컨테이너 (실시간 배경색 반영 적용) -->
            <div id="canvas-container" class="flex-1 p-4 flex items-center justify-center relative transition-colors" style="background-color: #ffffff;">
                <p id="canvas-placeholder" class="text-slate-400 text-sm absolute">
                    좌측에서 데이터를 입력하고 클라우드를 생성해주세요.
                </p>
                
                <!-- Regenerate Button (Floats over canvas) -->
                <button onclick="generateWordCloud()" id="btn-regenerate" class="absolute top-4 right-4 bg-white/90 hover:bg-slate-100 text-slate-700 border border-slate-200 shadow-sm px-3 py-2 rounded-lg text-sm font-medium transition-all hidden items-center gap-2 z-10 backdrop-blur-sm">
                    <i class="fa-solid fa-rotate-right text-indigo-500"></i> 다시 그리기
                </button>

                <!-- Canvas will dynamically resize -->
                <canvas id="word-cloud-canvas" class="max-w-full max-h-full"></canvas>
            </div>
        </section>

    </main>

    <!-- Custom Modal Backdrop -->
    <div id="edit-word-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center">
        <!-- Edit Word Modal Content -->
        <div class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden modal-enter" id="edit-word-modal-content">
            <div class="px-6 py-5">
                <h3 class="text-lg font-bold text-slate-800 mb-4">단어 수정</h3>
                <input type="hidden" id="edit-word-index">
                <div class="mb-2">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">새 단어 입력</label>
                    <input type="text" id="edit-word-input" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="수정할 단어" onkeydown="if(event.key==='Enter') saveEditedWord()">
                </div>
                <p class="text-xs text-slate-500">저장 시 원문에서 이 단어의 등장 횟수를 다시 계산하여 적용합니다.</p>
            </div>
            <div class="bg-slate-50 px-6 py-3 border-t border-slate-100 flex justify-end gap-2">
                <button onclick="closeEditModal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-200 rounded-lg transition-colors">취소</button>
                <button onclick="saveEditedWord()" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors">저장</button>
            </div>
        </div>
    </div>

    <div id="custom-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center">
        <!-- Modal Content -->
        <div class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden modal-enter" id="custom-modal-content">
            <div class="px-6 py-5">
                <h3 id="modal-title" class="text-lg font-bold text-slate-800 mb-2">알림</h3>
                <p id="modal-message" class="text-sm text-slate-600 break-keep leading-relaxed whitespace-pre-line">메시지 내용</p>
            </div>
            <div class="bg-slate-50 px-6 py-3 border-t border-slate-100 flex justify-end gap-2">
                <button id="modal-btn-cancel" class="hidden px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-200 rounded-lg transition-colors">취소</button>
                <button id="modal-btn-confirm" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors">확인</button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-white/70 backdrop-blur-[2px] hidden z-40 flex items-center justify-center flex-col gap-3">
        <div class="spinner"></div>
        <span class="text-sm font-medium text-slate-600" id="loading-msg">처리 중입니다...</span>
    </div>

    <script>
        // State
        let extractedKeywords = []; // Array of {word, count}

        // Initialization
        window.addEventListener('resize', resizeCanvas);

        // --- Custom Modal (Replacement for alert/confirm) ---

        function showModal(title, message, isConfirm = false, onConfirm = null) {
            const modal = document.getElementById('custom-modal');
            const content = document.getElementById('custom-modal-content');
            const titleEl = document.getElementById('modal-title');
            const messageEl = document.getElementById('modal-message');
            const btnCancel = document.getElementById('modal-btn-cancel');
            const btnConfirm = document.getElementById('modal-btn-confirm');

            titleEl.textContent = title;
            messageEl.textContent = message;
            
            // Setup buttons
            btnConfirm.onclick = () => {
                closeModal();
                if (onConfirm) onConfirm();
            };

            if (isConfirm) {
                btnCancel.classList.remove('hidden');
                btnCancel.onclick = closeModal;
            } else {
                btnCancel.classList.add('hidden');
            }

            modal.classList.remove('hidden');
            // Trigger animation
            requestAnimationFrame(() => {
                content.classList.remove('modal-enter');
                content.classList.add('modal-enter-active');
            });
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const content = document.getElementById('custom-modal-content');
            content.classList.remove('modal-enter-active');
            content.classList.add('modal-enter');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function showLoading(show, message = "처리 중입니다...") {
            const overlay = document.getElementById('loading-overlay');
            const msgEl = document.getElementById('loading-msg');
            if (show) {
                msgEl.textContent = message;
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
            }
        }

        // --- pywebview Communication ---

        function loadSampleData() {
            const sampleText = "학교 학생 생활 학업 성적 우수 참여 태도 교우 관계 독서 활동 진로 탐색 봉사 배려 소통 리더십 창의성 문제해결 동아리 자율 진로 교과 선생님 발표 실험 체육 미술 음악 영어 수학 국어 과학 사회 역사 지리 윤리 정보 프로그래밍 코딩 동아리장 부반장 반장 회장 봉사상 공로상 표창장 독후감 보고서 소논문 프로젝트 협업 소통능력 자기주도학습 성실함 책임감 리더쉽 배려심 창의력 사고력 탐구력 논리력 인성 예절 규범 준수 성실 봉사활동 헌신 나눔 배려 협동심 공동체 의식 글로벌 미래 인재 융합 핵심 역량 의사소통 비판적 지식 정보처리 심미적 감성 건강 체력 기본 습관 규칙 정서 안정 긍정적 자아존중감 진로설계 직업 가치관 문화 다양성 이해 갈등 관리 협상 토론 발표력 경청 공감 타인 존중 민주시민 세계시민 생태 전환 환경 보호 탄소 중립 지속가능 발전 인공지능 디지털 리터러시 소프트웨어 데이터 분석 알고리즘 앱 개발 웹 기획 디자인 포트폴리오 멘토링 튜터링 또래 상담 방과후 자율학습 심화 보충 동기부여 성취감 자신감 끈기 도전 실패 극복 회복탄력성 유연성 적응력 창안 혁신 기업가정신 경제 금융 실생활 응용 융합과학 실험관찰 모둠 역할 분담 책임 완수 결과 도출 피드백 성찰 성장 발달 잠재력 특기 적성 재능 발굴 자기이해 가치관 확립 목표 설정 계획 수립 실천 평가 개선 포기하지않는 노력 결실 맺음 모범 귀감 칭찬 격려 지지 응원 행복 즐거움 보람 자긍심 애교심 학습동기 지적호기심 심층탐구 문헌조사 설문조사 데이터수집 통계분석 유의미한결론 창의적산출물 독창성 실용성 완성도 프레젠테이션 전달력 호소력 설득력 논리적근거 합리적추론 다각적분석 비판적사고 종합적판단";
            document.getElementById('input-text').value = sampleText;
        }

        async function extractKeywords() {
            let textToProcess = document.getElementById('input-text').value.trim();

            if (!textToProcess || textToProcess.trim() === "") {
                showModal("알림", "분석할 텍스트나 데이터가 없습니다. 먼저 텍스트를 입력해주세요.");
                return;
            }

            const excludeParticles = document.getElementById('opt-exclude-particles').checked;
            const maxExtractWords = 500; 

            showLoading(true, "형태소 분석 및 키워드 추출 중...");

            // [핵심 수정] iframe 환경을 고려하여 부모 창(window.parent)의 pywebview 객체를 찾습니다.
            const pyObj = window.pywebview || window.parent.pywebview;

            // 파이썬 객체를 찾은 경우 (정상 통신)
            if (pyObj && pyObj.api && pyObj.api.extract_keywords) {
                try {
                    const result = await pyObj.api.extract_keywords(textToProcess, {
                        exclude_particles: excludeParticles,
                        max_words: maxExtractWords
                    });
                    showLoading(false);
                    if (result && result.error) {
                        showModal("오류", "추출 중 오류 발생: " + result.error);
                    } else {
                        extractedKeywords = result.keywords; 
                        renderKeywordList();
                    }
                } catch (e) {
                    showLoading(false);
                    showModal("오류", "Python 통신 중 문제가 발생했습니다.");
                }
            } else {
                // 파이썬 객체를 찾지 못한 경우 (에러 확인용)
                showLoading(false);
                showModal("알림", "파이썬 모듈과 연결되지 않았습니다. (iframe 통신 오류)");
            }
        }

        // Basic dummy extractor
        function dummyExtract(text, max) {
            const words = text.split(/[\s,.;!?]+/).filter(w => w.length > 1);
            const counts = {};
            words.forEach(w => counts[w] = (counts[w] || 0) + 1);
            let arr = Object.keys(counts).map(k => ({ word: k, count: counts[k] }));
            arr.sort((a, b) => b.count - a.count);
            return arr.slice(0, max);
        }

        // --- Keyword Editing ---

        function renderKeywordList() {
            const tbody = document.getElementById('keyword-list-body');
            tbody.innerHTML = '';
            
            document.getElementById('keyword-count-badge').textContent = `총 ${extractedKeywords.length}개 대기중`;

            if (extractedKeywords.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="px-4 py-8 text-center text-slate-400">추출된 키워드가 없습니다.</td></tr>`;
            } else {
                extractedKeywords.forEach((item, index) => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50 transition-colors group";
                    tr.innerHTML = `
                        <td class="px-3 py-1.5 flex items-center justify-between">
                            <span id="word-text-${index}" class="font-medium text-slate-700 truncate">${item.word}</span>
                            <button onclick="openEditModal(${index})" class="text-slate-400 hover:text-blue-500 opacity-0 group-hover:opacity-100 transition-opacity p-1" title="단어 수정">
                                <i class="fa-solid fa-pencil text-xs"></i>
                            </button>
                        </td>
                        <td class="px-2 py-1 text-center border-l border-slate-100">
                            <input id="word-count-${index}" type="number" value="${item.count}" min="0" 
                                class="w-14 border border-transparent group-hover:border-slate-300 rounded px-1 py-1 text-center text-sm focus:outline-none focus:border-blue-500 bg-transparent focus:bg-white transition-colors"
                                onchange="updateWordCount(${index}, this.value)">
                        </td>
                        <td class="px-2 py-1 text-center border-l border-slate-100">
                            <button onclick="removeWord(${index})" class="text-slate-300 hover:text-red-500 transition-colors p-1.5 rounded-md hover:bg-red-50" title="삭제">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // Show Edit Panel
            document.getElementById('panel-edit').classList.remove('hidden');
        }

        function openEditModal(index) {
            const modal = document.getElementById('edit-word-modal');
            const content = document.getElementById('edit-word-modal-content');
            
            document.getElementById('edit-word-index').value = index;
            document.getElementById('edit-word-input').value = extractedKeywords[index].word;
            
            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                content.classList.remove('modal-enter');
                content.classList.add('modal-enter-active');
                document.getElementById('edit-word-input').focus();
            });
        }

        function closeEditModal() {
            const modal = document.getElementById('edit-word-modal');
            const content = document.getElementById('edit-word-modal-content');
            
            content.classList.remove('modal-enter-active');
            content.classList.add('modal-enter');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function saveEditedWord() {
            const indexStr = document.getElementById('edit-word-index').value;
            if (!indexStr) return;
            
            const index = parseInt(indexStr);
            const newText = document.getElementById('edit-word-input').value.trim();
            
            if (!newText) {
                closeEditModal();
                return;
            }

            // 1. 원문에서 새 단어(newText)의 실제 빈도수 다시 계산
            const rawText = document.getElementById('input-text').value;
            const recalculatedCount = rawText.split(newText).length - 1;
            
            // 2. 데이터 업데이트 (목록 재배치나 병합 없이 해당 값만 수정, 0이면 0으로)
            extractedKeywords[index].word = newText;
            extractedKeywords[index].count = recalculatedCount;

            // 3. UI만 해당 행(Row) 업데이트 (전체 리렌더링 X)
            document.getElementById(`word-text-${index}`).textContent = newText;
            document.getElementById(`word-count-${index}`).value = recalculatedCount;

            closeEditModal();
        }

        function updateWordCount(index, newCount) {
            let val = parseInt(newCount);
            if (isNaN(val) || val < 0) val = 0; // 0 입력 허용
            extractedKeywords[index].count = val;
            // 수동으로 숫자를 고쳤을 때도 목록을 재정렬하지 않음
        }

        function removeWord(index) {
            extractedKeywords.splice(index, 1);
            renderKeywordList(); // 삭제할 때만 테이블 재구성
        }

        // --- Word Cloud Rendering ---

        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            const canvas = document.getElementById('word-cloud-canvas');
            
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width - 32; 
            canvas.height = rect.height - 32;
        }

        function getThemeColorArray(theme) {
            const palettes = {
                colorful: ['#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4', '#3b82f6', '#8b5cf6', '#d946ef'],
                blue: ['#0c4a6e', '#075985', '#0369a1', '#0284c7', '#38bdf8', '#7dd3fc'],
                warm: ['#7c2d12', '#9a3412', '#c2410c', '#ea580c', '#f97316', '#fb923c', '#fcd34d'],
                monochrome: ['#0f172a', '#1e293b', '#334155', '#475569', '#64748b', '#94a3b8']
            };
            return palettes[theme] || palettes.colorful;
        }

        function generateWordCloud() {
            if (extractedKeywords.length === 0) {
                showModal("알림", "그릴 키워드가 없습니다. 단어를 먼저 추출해주세요.");
                return;
            }

            document.getElementById('canvas-placeholder').style.display = 'none';
            document.getElementById('btn-copy').classList.remove('hidden');
            document.getElementById('btn-regenerate').classList.remove('hidden');
            document.getElementById('btn-regenerate').style.display = 'flex';
            
            resizeCanvas();
            
            const canvas = document.getElementById('word-cloud-canvas');
            const shape = document.getElementById('opt-shape').value;
            const theme = document.getElementById('opt-theme').value;
            const colors = getThemeColorArray(theme);
            
            const maxWordsLimit = parseInt(document.getElementById('opt-max-words').value) || 100;
            
            // 빈도수가 0이하인 단어는 제외하고 정렬
            const validKeywords = extractedKeywords.filter(k => k.count > 0);
            const sortedList = [...validKeywords].sort((a, b) => b.count - a.count);
            const listToDraw = sortedList.slice(0, maxWordsLimit);

            if (listToDraw.length === 0) {
                showModal("알림", "빈도수가 1 이상인 단어가 없습니다.");
                return;
            }

            const maxCount = Math.max(...listToDraw.map(k => k.count));
            const minCount = Math.min(...listToDraw.map(k => k.count));
            
            const maxFontSize = Math.min(canvas.width, canvas.height) / 5; 
            const minFontSize = 14;

            const list = listToDraw.map(k => {
                let size;
                if (maxCount === minCount) {
                    size = maxFontSize / 2;
                } else {
                    size = minFontSize + ((k.count - minCount) / (maxCount - minCount)) * (maxFontSize - minFontSize);
                }
                return [k.word, size];
            });

            // Call wordcloud2.js (배경색을 투명으로 설정하여 복사할 때 원하는 배경 적용 가능하게 처리)
            WordCloud(canvas, {
                list: list,
                fontFamily: getComputedStyle(document.body).fontFamily,
                fontWeight: 'bold',
                color: function () {
                    return colors[Math.floor(Math.random() * colors.length)];
                },
                rotateRatio: 0.3,
                rotationSteps: 2,
                backgroundColor: 'transparent', 
                shape: shape,
                drawOutOfBound: false,
                shrinkToFit: true
            });
        }

        // --- Export (Copy to Clipboard) ---

        async function copyImage() {
            const canvas = document.getElementById('word-cloud-canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            
            if(canvas.width === 0 || canvas.height === 0) {
                showModal("알림", "복사할 워드 클라우드가 없습니다.");
                return;
            }

            try {
                // 1. 캔버스의 실제 글자가 그려진 영역(Bounding Box) 계산
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;
                let hasContent = false;

                for (let y = 0; y < canvas.height; y++) {
                    for (let x = 0; x < canvas.width; x++) {
                        const alpha = data[(y * canvas.width + x) * 4 + 3];
                        if (alpha > 0) { // 투명하지 않은 픽셀(글자) 발견 시
                            if (x < minX) minX = x;
                            if (y < minY) minY = y;
                            if (x > maxX) maxX = x;
                            if (y > maxY) maxY = y;
                            hasContent = true;
                        }
                    }
                }

                if (!hasContent) {
                    showModal("알림", "캔버스에 그려진 내용이 없습니다.");
                    return;
                }

                // 2. 잘라낼 크기와 설정된 고정 여백(15px), 배경색 가져오기
                const cropWidth = maxX - minX;
                const cropHeight = maxY - minY;
                const pad = 15;
                const bg = document.getElementById('opt-bg-color').value || '#ffffff';

                // 여백을 포함할 임시 캔버스 생성 (불필요한 투명 공간 제거)
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = cropWidth + (pad * 2);
                tempCanvas.height = cropHeight + (pad * 2);
                const tctx = tempCanvas.getContext('2d');

                // 3. 선택한 배경색 채우기
                tctx.fillStyle = bg;
                tctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

                // 4. 원본 캔버스에서 딱 글자가 있는 부분(Bounding Box)만 잘라내어 새 캔버스 중앙에 그리기
                tctx.drawImage(
                    canvas, 
                    minX, minY, cropWidth, cropHeight, // 소스(원본)에서 자를 영역
                    pad, pad, cropWidth, cropHeight    // 대상(새 캔버스)에 그릴 위치와 크기
                );

                // 5. 만들어진 임시 캔버스를 이미지 Blob으로 변환하여 클립보드에 복사
                tempCanvas.toBlob(async function(blob) {
                    try {
                        const item = new ClipboardItem({ "image/png": blob });
                        await navigator.clipboard.write([item]);
                        showModal("성공", "워드 클라우드 이미지가 클립보드에 복사되었습니다!\n\n문서나 메신저에 'Ctrl + V'로 바로 붙여넣어 보세요.");
                    } catch (err) {
                        showModal("오류", "클립보드 복사를 지원하지 않거나 권한이 없는 환경입니다.\n" + err.message);
                    }
                }, 'image/png');
            } catch(e) {
                showModal("오류", "이미지 복사 중 오류가 발생했습니다.");
            }
        }

        // Initial setup
        window.onload = () => {
            resizeCanvas();
        };

    </script>
</body>
