<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>환율 계산기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .spinner {
            border: 3px solid rgba(0, 0, 0, 0.05);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border-left-color: #2563eb;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        /* 최소 글자 크기 15pt(약 20px) 기준 설정 */
        .text-15pt { font-size: 20px; line-height: 1.4; }
    </style>
</head>
<body class="p-2">

    <!-- 커스텀 알림창 -->
    <div id="msgBox" class="fixed inset-0 z-50 flex items-center justify-center hidden bg-black/30 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
            <div class="text-blue-600 mb-2 text-center text-4xl"><i class="fas fa-info-circle"></i></div>
            <p id="msgContent" class="text-gray-700 text-center font-bold text-15pt mb-4"></p>
            <button onclick="closeMsg()" class="w-full py-3 bg-blue-600 text-white font-black rounded-xl text-15pt hover:bg-blue-700 transition-all">확인</button>
        </div>
    </div>

    <!-- 메인 컨테이너: 최대 1000px 제한 및 콤팩트 레이아웃 -->
    <div class="max-w-[1000px] w-full flex flex-col lg:flex-row gap-4 items-stretch">
        
        <!-- [좌측] 메인 계산기 -->
        <div class="flex-1">
            <div class="glass-card rounded-[1.5rem] p-6 lg:p-8 space-y-4 h-full">
                <div class="flex items-center justify-between lg:justify-start lg:gap-4">
                    <h1 class="text-2xl font-black text-gray-900 tracking-tight">환율 계산기</h1>
                    <p class="text-15pt text-blue-600 font-bold uppercase">GLOBAL HUB</p>
                </div>

                <div class="space-y-4">
                    <!-- 금액 입력 -->
                    <div class="space-y-1">
                        <label class="text-15pt font-black text-gray-500 uppercase tracking-wider ml-1">금액</label>
                        <div class="relative">
                            <input type="number" id="amount" value="1000"
                                class="w-full p-4 bg-gray-50 border-2 border-transparent focus:border-blue-500 rounded-xl text-3xl font-black text-gray-900 focus:outline-none focus:ring-4 focus:ring-blue-100 transition-all">
                            <div class="absolute right-6 top-1/2 -translate-y-1/2 text-gray-400 font-black text-15pt" id="baseUnit">KRW</div>
                        </div>
                    </div>

                    <!-- 통화 선택 -->
                    <div class="grid grid-cols-1 xl:grid-cols-[1fr_auto_1fr] items-center gap-3">
                        <div class="space-y-1">
                            <label class="text-15pt font-black text-gray-500 uppercase ml-1">From</label>
                            <select id="fromCurrency" class="w-full p-3 bg-white border border-gray-100 rounded-xl focus:outline-none cursor-pointer font-bold text-15pt text-gray-800 shadow-sm">
                                <option value="KRW" selected>대한민국 (KRW)</option>
                                <option value="USD">미국 (USD)</option>
                                <option value="JPY">일본 (JPY)</option>
                                <option value="EUR">유럽 (EUR)</option>
                                <option value="CNY">중국 (CNY)</option>
                                <option value="GBP">영국 (GBP)</option>
                                <option value="AUD">호주 (AUD)</option>
                            </select>
                        </div>
                        <div class="flex justify-center pt-6">
                            <button id="swapBtn" class="p-3 rounded-lg hover:bg-blue-600 hover:text-white text-blue-600 transition-all shadow bg-white border border-blue-50">
                                <i class="fas fa-exchange-alt"></i>
                            </button>
                        </div>
                        <div class="space-y-1">
                            <label class="text-15pt font-black text-gray-500 uppercase ml-1">To</label>
                            <select id="toCurrency" class="w-full p-3 bg-white border border-gray-100 rounded-xl focus:outline-none cursor-pointer font-bold text-15pt text-gray-800 shadow-sm">
                                <option value="KRW">대한민국 (KRW)</option>
                                <option value="USD" selected>미국 (USD)</option>
                                <option value="JPY">일본 (JPY)</option>
                                <option value="EUR">유럽 (EUR)</option>
                                <option value="CNY">중국 (CNY)</option>
                                <option value="GBP">영국 (GBP)</option>
                                <option value="AUD">호주 (AUD)</option>
                            </select>
                        </div>
                    </div>

                    <!-- 로딩 중 표시 -->
                    <div id="loading" class="hidden p-3 bg-blue-50 border border-blue-100 rounded-xl flex justify-between items-center">
                        <span class="text-15pt font-bold text-blue-700">업데이트 중...</span>
                        <div class="spinner"></div>
                    </div>

                    <!-- 결과 표시 섹션 -->
                    <div id="result" class="hidden p-6 bg-blue-600 rounded-[1.2rem] text-center text-white space-y-1 shadow-lg fade-in">
                        <div id="resSummary" class="text-15pt font-bold opacity-80"></div>
                        <div id="resValue" class="text-4xl font-black"></div>
                        <div id="resRate" class="text-15pt font-medium opacity-80"></div>
                    </div>

                    <button id="calcBtn" class="w-full py-4 bg-gray-900 hover:bg-black text-white font-black text-15pt rounded-xl shadow transition-all active:scale-[0.98]">
                        환율 계산하기
                    </button>
                </div>
            </div>
        </div>

        <!-- [우측] 주요 통화 요약 목록 -->
        <div class="w-full lg:w-[360px] flex flex-col">
            <div class="glass-card rounded-[1.5rem] p-6 h-full flex flex-col">
                <div class="flex flex-col mb-4 space-y-1">
                    <h2 class="text-xl font-black text-gray-900 uppercase">주요 통화 요약</h2>
                    <div id="resTime" class="text-15pt text-blue-600 font-black bg-blue-50 px-2 py-0.5 rounded-lg self-start">대기 중</div>
                </div>
                
                <div id="favList" class="flex-1 overflow-y-auto space-y-3 pr-1 scrollbar-hide">
                    <div class="flex flex-col items-center justify-center h-full text-center opacity-30">
                        <i class="fas fa-chart-line text-5xl mb-2"></i>
                        <p class="text-15pt font-bold">목록 자동 업데이트</p>
                    </div>
                </div>

                <div class="mt-4 p-3 bg-gray-50 rounded-xl border border-gray-100 text-center">
                    <p class="text-15pt text-gray-400 font-bold">실시간 공공 API 데이터</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        const amountInput = document.getElementById('amount');
        const fromSelect = document.getElementById('fromCurrency');
        const toSelect = document.getElementById('toCurrency');
        const swapBtn = document.getElementById('swapBtn');
        const calcBtn = document.getElementById('calcBtn');
        const loadingDiv = document.getElementById('loading');
        const resultDiv = document.getElementById('result');
        const favList = document.getElementById('favList');
        const baseUnit = document.getElementById('baseUnit');

        const favoriteCurrencies = ['USD', 'JPY', 'EUR', 'CNY', 'GBP', 'AUD', 'KRW'];
        
        const currencyNames = {
            'KRW': '원',
            'USD': '달러',
            'JPY': '엔',
            'EUR': '유로',
            'CNY': '위안',
            'GBP': '파운드',
            'AUD': '달러'
        };

        function showMsg(m) {
            document.getElementById('msgContent').innerText = m;
            document.getElementById('msgBox').classList.remove('hidden');
        }
        function closeMsg() {
            document.getElementById('msgBox').classList.add('hidden');
        }

        fromSelect.addEventListener('change', () => {
            baseUnit.textContent = fromSelect.value;
        });

        swapBtn.addEventListener('click', () => {
            const t = fromSelect.value;
            fromSelect.value = toSelect.value;
            toSelect.value = t;
            baseUnit.textContent = fromSelect.value;
        });

        async function getAllRates(base) {
            try {
                const response = await fetch(`https://open.er-api.com/v6/latest/${base}`);
                if (!response.ok) throw new Error("FETCH_ERROR");
                const data = await response.json();
                if (data.result === "success") {
                    return data;
                } else {
                    throw new Error("DATA_ERROR");
                }
            } catch (e) {
                console.error(e);
                throw e;
            }
        }

        function renderFavorites(amt, base, rates) {
            favList.innerHTML = '';
            
            favoriteCurrencies.forEach(code => {
                if (code === base) return;

                const rate = rates[code];
                const value = (amt * rate).toLocaleString(undefined, {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });

                const name = currencyNames[code] || code;

                const item = document.createElement('div');
                item.className = "flex justify-between items-center p-3 bg-white border border-gray-100 rounded-xl hover:border-blue-200 transition-all fade-in";
                item.innerHTML = `
                    <div class="space-y-0.5">
                        <div class="flex items-center gap-2">
                            <span class="text-15pt font-black text-blue-600">${code}</span>
                            <span class="text-15pt font-bold text-gray-500">${name}</span>
                        </div>
                        <div class="text-15pt text-gray-400 font-medium">1 ${base} = ${rate.toFixed(4)}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-15pt font-black text-gray-900">${value}</div>
                        <div class="text-15pt text-gray-400 font-bold">${code}</div>
                    </div>
                `;
                favList.appendChild(item);
            });
        }

        calcBtn.addEventListener('click', async () => {
            const amt = parseFloat(amountInput.value);
            const from = fromSelect.value;
            const to = toSelect.value;

            if (isNaN(amt) || amt <= 0) {
                showMsg("숫자를 입력해 주세요.");
                return;
            }

            calcBtn.disabled = true;
            loadingDiv.classList.remove('hidden');
            resultDiv.classList.add('hidden');

            try {
                const data = await getAllRates(from);
                const currentRate = data.rates[to];
                
                const total = (amt * currentRate).toLocaleString(undefined, {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });

                document.getElementById('resSummary').innerText = `${amt.toLocaleString()} ${from} ➔`;
                document.getElementById('resValue').innerText = `${total} ${to}`;
                document.getElementById('resRate').innerText = `환율: 1 ${from} = ${currentRate.toFixed(4)} ${to}`;
                
                const date = new Date(data.time_last_update_utc);
                const formattedTime = date.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' }).split(' ').slice(1).join(' ');
                document.getElementById('resTime').innerText = `업데이트: ${formattedTime}`;
                
                resultDiv.classList.remove('hidden');
                renderFavorites(amt, from, data.rates);

            } catch (err) {
                showMsg("네트워크 오류");
            } finally {
                loadingDiv.classList.add('hidden');
                calcBtn.disabled = false;
            }
        });

        window.onload = () => calcBtn.click();
    </script>
</body>
</html>
