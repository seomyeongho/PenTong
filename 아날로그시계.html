<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아날로그 시계</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Orbitron:wght@400;700&family=Playfair+Display:wght@700&display=swap');

        body {
            font-family: 'Montserrat', sans-serif;
            transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s;
        }

        /* 캔버스 렌더링 최적화 */
        canvas {
            filter: drop-shadow(0 0 2px rgba(0,0,0,0.1));
        }

        /* --- 스타일별 배경 및 효과 --- */

        /* 럭셔리 (Luxury) */
        .style-luxury-light {
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            box-shadow: 20px 20px 60px #d1d1d1, -20px -20px 60px #ffffff;
            border-radius: 50%;
        }

        .style-luxury-dark {
            background: linear-gradient(145deg, #2a2a2a, #1f1f1f);
            box-shadow: 20px 20px 50px #151515, -20px -20px 50px #333333;
            border-radius: 50%;
        }

        /* 모던 (Modern) */
        .style-modern-light {
            background-color: #f3f4f6;
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.25);
            border-radius: 50%;
            border: 8px solid #111;
        }

        .style-modern-dark {
            background-color: #111;
            box-shadow: 0 20px 50px -12px rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 8px solid #eee;
        }

        /* 사이버 (Cyber) */
        .style-cyber {
            background: radial-gradient(circle at center, #0f172a 0%, #000000 100%);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.2), inset 0 0 50px rgba(6, 182, 212, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(6, 182, 212, 0.5);
        }

        /* --- 설정 사이드바 애니메이션 및 레이아웃 --- */
        #settingsSidebar {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), margin-right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            width: 20rem; /* 320px */
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            z-index: 30;
        }

            #settingsSidebar.closed {
                transform: translateX(100%);
            }

            #settingsSidebar.open {
                transform: translateX(0);
            }

        /* PC/태블릿 환경에서는 밀어내기(Push) 방식으로 시계를 가리지 않음 */
        @media (min-width: 768px) {
            #settingsSidebar {
                position: relative;
            }

                #settingsSidebar.closed {
                    transform: translateX(0);
                    margin-right: -20rem;
                }

                #settingsSidebar.open {
                    transform: translateX(0);
                    margin-right: 0;
                }
        }
    </style>
</head>
<body id="body" class="bg-gray-50 text-gray-800 h-screen w-screen overflow-hidden selection:bg-indigo-500 selection:text-white transition-colors duration-500">

    <div class="flex w-full h-full relative">
        <!-- 메인 시계 영역 (플렉스 레이아웃으로 설정창 열림에 따라 유동적으로 크기/위치 조절) -->
        <div class="flex-1 h-full flex items-center justify-center relative transition-all duration-400">
            <!-- 상단 설정 버튼 -->
            <div class="absolute top-6 right-6 z-20">
                <button onclick="toggleSettings()" class="w-12 h-12 rounded-full bg-white/80 dark:bg-gray-800/80 backdrop-blur-sm shadow-lg hover:scale-105 transition-all flex items-center justify-center focus:outline-none ring-1 ring-gray-200 dark:ring-gray-700 active:scale-95" title="설정">
                    <i class="fas fa-sliders-h text-xl text-gray-600 dark:text-gray-300"></i>
                </button>
            </div>

            <!-- 시계 컨테이너 -->
            <div id="clockWrapper" class="relative w-80 h-80 md:w-[28rem] md:h-[28rem] transition-all duration-500 flex items-center justify-center style-luxury-light group cursor-pointer" onclick="toggleSettings()">
                <canvas id="clockCanvas" width="800" height="800" class="w-full h-full rounded-full transition-transform duration-500 hover:scale-[1.02]"></canvas>
            </div>
        </div>

        <!-- 우측 설정 사이드바 패널 -->
        <div id="settingsSidebar" class="closed bg-white/95 dark:bg-gray-900/95 backdrop-blur-xl border-l border-gray-200 dark:border-gray-800 shadow-2xl flex-shrink-0 flex flex-col">
            <div class="p-6 h-full overflow-y-auto">
                <!-- 모달 헤더 -->
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-gray-800 dark:text-white">설정</h2>
                    <button onclick="toggleSettings()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                        <i class="fas fa-times text-gray-500 dark:text-gray-400"></i>
                    </button>
                </div>

                <!-- 섹션 1: 테마 -->
                <div class="mb-6">
                    <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-3 uppercase tracking-wider">테마 모드</p>
                    <div class="flex bg-gray-100 dark:bg-gray-800 p-1 rounded-xl">
                        <button onclick="setTheme(false)" id="btn-theme-light" class="flex-1 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center justify-center gap-2">
                            <i class="fas fa-sun text-amber-500"></i> 라이트
                        </button>
                        <button onclick="setTheme(true)" id="btn-theme-dark" class="flex-1 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center justify-center gap-2">
                            <i class="fas fa-moon text-indigo-400"></i> 다크
                        </button>
                    </div>
                </div>

                <!-- 섹션 2: 시계 디자인 -->
                <div>
                    <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-3 uppercase tracking-wider">시계 디자인</p>
                    <div class="space-y-2">
                        <button onclick="changeStyle('luxury')" id="btn-style-luxury" class="w-full flex items-center justify-between p-3 rounded-xl border border-gray-200 dark:border-gray-700 hover:border-amber-500 dark:hover:border-amber-500 hover:bg-amber-50 dark:hover:bg-gray-800 transition-all group">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-gray-100 to-gray-300 shadow-sm border border-gray-300 flex items-center justify-center">
                                    <div class="w-1 h-3 bg-gray-800 rounded-full"></div>
                                </div>
                                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Luxury</span>
                            </div>
                            <i class="fas fa-check text-amber-500 opacity-0 group-[.active]:opacity-100"></i>
                        </button>

                        <button onclick="changeStyle('modern')" id="btn-style-modern" class="w-full flex items-center justify-between p-3 rounded-xl border border-gray-200 dark:border-gray-700 hover:border-rose-500 dark:hover:border-rose-500 hover:bg-rose-50 dark:hover:bg-gray-800 transition-all group">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-white border-4 border-gray-900 shadow-sm flex items-center justify-center">
                                    <div class="w-1.5 h-1.5 bg-rose-500 rounded-full"></div>
                                </div>
                                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Modern</span>
                            </div>
                            <i class="fas fa-check text-rose-500 opacity-0 group-[.active]:opacity-100"></i>
                        </button>

                        <button onclick="changeStyle('cyber')" id="btn-style-cyber" class="w-full flex items-center justify-between p-3 rounded-xl border border-gray-200 dark:border-gray-700 hover:border-cyan-500 dark:hover:border-cyan-500 hover:bg-cyan-50 dark:hover:bg-gray-800 transition-all group">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-black border border-cyan-500 shadow-[0_0_5px_rgba(6,182,212,0.5)] flex items-center justify-center">
                                    <div class="w-4 h-4 rounded-full border border-cyan-400"></div>
                                </div>
                                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Cyber</span>
                            </div>
                            <i class="fas fa-check text-cyan-500 opacity-0 group-[.active]:opacity-100"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('clockCanvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('clockWrapper');

        let radius = canvas.height / 2;
        ctx.translate(radius, radius);
        radius = radius * 0.90;

        let isDark = false;
        let currentStyle = 'luxury'; // 'luxury', 'modern', 'cyber'
        let animationFrameId;

        // --- 초기화 ---
        window.onload = () => {
            setTheme(false); // 시스템 설정과 무관하게 항상 라이트 모드로 강제 초기화
            animate();
        };

        function animate() {
            draw();
            animationFrameId = requestAnimationFrame(animate);
        }

        // --- 사이드바 설정 토글 로직 ---
        function toggleSettings() {
            const sidebar = document.getElementById('settingsSidebar');
            if (sidebar.classList.contains('closed')) {
                sidebar.classList.remove('closed');
                sidebar.classList.add('open');
            } else {
                sidebar.classList.remove('open');
                sidebar.classList.add('closed');
            }
        }

        // --- 테마 로직 ---
        function setTheme(dark) {
            isDark = dark;
            const body = document.getElementById('body');

            if (isDark) {
                body.classList.add('dark');
                body.classList.remove('bg-gray-50', 'text-gray-800');
                body.classList.add('bg-gray-900', 'text-gray-100');
            } else {
                body.classList.remove('dark');
                body.classList.remove('bg-gray-900', 'text-gray-100');
                body.classList.add('bg-gray-50', 'text-gray-800');
            }
            updateUI();
        }

        // --- 스타일 로직 ---
        function changeStyle(styleName) {
            currentStyle = styleName;
            updateUI();
        }

        // --- UI 업데이트 (통합) ---
        function updateUI() {
            updateWrapperStyle();
            updateModalUI();
        }

        function updateWrapperStyle() {
            wrapper.className = "relative w-80 h-80 md:w-[28rem] md:h-[28rem] transition-all duration-500 flex items-center justify-center group cursor-pointer";

            if (currentStyle === 'luxury') {
                wrapper.classList.add(isDark ? 'style-luxury-dark' : 'style-luxury-light');
            } else if (currentStyle === 'modern') {
                wrapper.classList.add(isDark ? 'style-modern-dark' : 'style-modern-light');
            } else if (currentStyle === 'cyber') {
                wrapper.classList.add('style-cyber');
            }
        }

        function updateModalUI() {
            // 테마 버튼 상태
            const btnLight = document.getElementById('btn-theme-light');
            const btnDark = document.getElementById('btn-theme-dark');

            if (isDark) {
                btnLight.className = "flex-1 py-2 rounded-lg text-sm font-medium text-gray-500 transition-all duration-200 flex items-center justify-center gap-2 hover:bg-gray-200/50";
                btnDark.className = "flex-1 py-2 rounded-lg text-sm font-bold bg-white text-gray-900 shadow-sm transition-all duration-200 flex items-center justify-center gap-2";
            } else {
                btnLight.className = "flex-1 py-2 rounded-lg text-sm font-bold bg-white text-gray-900 shadow-sm transition-all duration-200 flex items-center justify-center gap-2";
                btnDark.className = "flex-1 py-2 rounded-lg text-sm font-medium text-gray-500 transition-all duration-200 flex items-center justify-center gap-2 hover:bg-gray-200/50";
            }

            // 스타일 버튼 상태
            ['luxury', 'modern', 'cyber'].forEach(style => {
                const btn = document.getElementById(`btn-style-${style}`);
                if (style === currentStyle) {
                    btn.classList.add('active', 'border-indigo-500', 'bg-indigo-50', 'dark:bg-indigo-900/30', 'dark:border-indigo-500');
                    btn.classList.remove('border-gray-200', 'dark:border-gray-700');
                } else {
                    btn.classList.remove('active', 'border-indigo-500', 'bg-indigo-50', 'dark:bg-indigo-900/30', 'dark:border-indigo-500');
                    btn.classList.add('border-gray-200', 'dark:border-gray-700');
                }
            });
        }

        // --- 그리기 함수 (draw) ---
        function draw() {
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.restore();

            const now = new Date();

            if (currentStyle === 'luxury') {
                drawLuxury(ctx, radius, now);
            } else if (currentStyle === 'modern') {
                drawModern(ctx, radius, now);
            } else if (currentStyle === 'cyber') {
                drawCyber(ctx, radius, now);
            }
        }

        // ==========================================
        // 스타일 1: 럭셔리 (Classic Watch)
        // ==========================================
        function drawLuxury(ctx, radius, now) {
            // 다이얼 배경
            const grad = ctx.createRadialGradient(0, 0, 5, 0, 0, radius);
            if (isDark) {
                grad.addColorStop(0, '#333');
                grad.addColorStop(0.9, '#1a1a1a');
                grad.addColorStop(1, '#111');
            } else {
                grad.addColorStop(0, '#f9f9f9');
                grad.addColorStop(0.9, '#e6e6e6');
                grad.addColorStop(1, '#d4d4d4');
            }
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, 2 * Math.PI);
            ctx.fillStyle = grad;
            ctx.fill();

            // 베젤
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, 2 * Math.PI);
            ctx.lineWidth = radius * 0.05;
            const bezelGrad = ctx.createLinearGradient(-radius, -radius, radius, radius);
            bezelGrad.addColorStop(0, '#b8b8b8');
            bezelGrad.addColorStop(0.5, '#f0f0f0');
            bezelGrad.addColorStop(1, '#8a8a8a');
            ctx.strokeStyle = bezelGrad;
            ctx.stroke();

            // 눈금
            ctx.strokeStyle = isDark ? '#888' : '#555';
            ctx.lineWidth = 2;
            for (let i = 0; i < 60; i++) {
                ctx.beginPath();
                ctx.rotate(Math.PI / 30);
                if (i % 5 !== 4) {
                    ctx.moveTo(0, -radius * 0.92);
                    ctx.lineTo(0, -radius * 0.95);
                    ctx.stroke();
                }
            }

            // 숫자
            ctx.font = `bold ${radius * 0.12}px 'Playfair Display', serif`;
            ctx.textBaseline = "middle";
            ctx.textAlign = "center";
            ctx.fillStyle = isDark ? '#e0e0e0' : '#222';

            for (let num = 1; num <= 12; num++) {
                let ang = num * Math.PI / 6;
                ctx.save();
                ctx.rotate(ang);
                ctx.translate(0, -radius * 0.80);
                ctx.rotate(-ang);
                ctx.fillText(num.toString(), 0, 0);
                ctx.restore();
            }

            // 바늘
            drawLuxuryHand(ctx, now, radius);

            // 캡
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.04, 0, 2 * Math.PI);
            ctx.fillStyle = isDark ? '#e0e0e0' : '#222';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.02, 0, 2 * Math.PI);
            ctx.fillStyle = '#999';
            ctx.fill();
        }

        function drawLuxuryHand(ctx, now, radius) {
            const hour = now.getHours() % 12;
            const minute = now.getMinutes();
            const second = now.getSeconds();
            const ms = now.getMilliseconds();
            const smoothSec = second + (ms / 1000);

            ctx.shadowColor = "rgba(0,0,0,0.3)";
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 4;
            ctx.shadowOffsetY = 4;

            const hAng = (hour * Math.PI / 6) + (minute * Math.PI / (6 * 60));
            drawBladeHand(ctx, hAng, radius * 0.55, radius * 0.04, isDark ? '#fff' : '#222');

            const mAng = (minute * Math.PI / 30) + (second * Math.PI / (30 * 60));
            drawBladeHand(ctx, mAng, radius * 0.85, radius * 0.03, isDark ? '#fff' : '#222');

            const sAng = (smoothSec * Math.PI / 30);
            ctx.shadowColor = "rgba(0,0,0,0.2)";
            drawNeedleHand(ctx, sAng, radius * 0.9, radius * 0.015, '#c2410c');

            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
        }

        function drawBladeHand(ctx, pos, length, width, color) {
            ctx.save();
            ctx.beginPath();
            ctx.rotate(pos);
            ctx.fillStyle = color;
            ctx.moveTo(0, length * 0.2);
            ctx.lineTo(-width / 2, 0);
            ctx.lineTo(0, -length);
            ctx.lineTo(width / 2, 0);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawNeedleHand(ctx, pos, length, width, color) {
            ctx.save();
            ctx.beginPath();
            ctx.rotate(pos);
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.moveTo(0, length * 0.2);
            ctx.lineTo(0, -length);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, -length * 0.7, width * 2, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.restore();
        }

        // ==========================================
        // 스타일 2: 모던 (Bauhaus)
        // ==========================================
        function drawModern(ctx, radius, now) {
            ctx.lineCap = "butt";
            for (let i = 0; i < 12; i++) {
                let ang = i * Math.PI / 6;
                ctx.save();
                ctx.rotate(ang);
                ctx.translate(0, -radius * 0.85);
                ctx.fillStyle = isDark ? '#fff' : '#111';
                if (i % 3 === 0) {
                    ctx.fillRect(-4, 0, 8, 40);
                } else {
                    ctx.fillRect(-2, 0, 4, 25);
                }
                ctx.restore();
            }

            const hour = now.getHours() % 12;
            const minute = now.getMinutes();
            const second = now.getSeconds();
            const ms = now.getMilliseconds();
            const smoothSec = second + (ms / 1000);

            const hAng = (hour * Math.PI / 6) + (minute * Math.PI / (6 * 60));
            ctx.save();
            ctx.rotate(hAng);
            ctx.fillStyle = isDark ? '#fff' : '#111';
            ctx.fillRect(-6, 15, 12, -radius * 0.55);
            ctx.restore();

            const mAng = (minute * Math.PI / 30) + (second * Math.PI / (30 * 60));
            ctx.save();
            ctx.rotate(mAng);
            ctx.fillStyle = isDark ? '#ccc' : '#444';
            ctx.fillRect(-4, 15, 8, -radius * 0.8);
            ctx.restore();

            const sAng = (smoothSec * Math.PI / 30);
            ctx.save();
            ctx.rotate(sAng);
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath();
            ctx.arc(0, -radius * 0.8, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 20);
            ctx.lineTo(0, -radius * 0.8);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 0, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // ==========================================
        // 스타일 3: 사이버 (Cyber)
        // ==========================================
        function drawCyber(ctx, radius, now) {
            const colorMain = '#22d3ee';
            const colorSub = '#a5f3fc';

            const second = now.getSeconds();
            const ms = now.getMilliseconds();
            const smoothSec = second + (ms / 1000);

            // 링 회전
            ctx.save();
            ctx.rotate(smoothSec * Math.PI / 30);
            ctx.strokeStyle = colorMain;
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 20]);
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.95, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();

            // 숫자
            ctx.font = `bold ${radius * 0.15}px 'Orbitron'`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = colorMain;
            ctx.shadowBlur = 10;
            ctx.shadowColor = colorMain;

            [12, 3, 6, 9].forEach(num => {
                const ang = num * Math.PI / 6;
                const x = Math.sin(ang) * (radius * 0.75);
                const y = -Math.cos(ang) * (radius * 0.75);
                ctx.fillText(num.toString(), x, y);
            });
            ctx.shadowBlur = 0;

            // 십자선
            ctx.strokeStyle = 'rgba(34, 211, 238, 0.2)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-radius * 0.6, 0);
            ctx.lineTo(radius * 0.6, 0);
            ctx.moveTo(0, -radius * 0.6);
            ctx.lineTo(0, radius * 0.6);
            ctx.stroke();

            // 바늘
            const hour = now.getHours() % 12;
            const minute = now.getMinutes();

            const hAng = (hour * Math.PI / 6) + (minute * Math.PI / (6 * 60));
            drawCyberHand(ctx, hAng, radius * 0.5, 6, colorSub);

            const mAng = (minute * Math.PI / 30) + (second * Math.PI / (30 * 60));
            drawCyberHand(ctx, mAng, radius * 0.8, 4, colorMain);

            // 초침
            const sAng = (smoothSec * Math.PI / 30);
            ctx.save();
            ctx.rotate(sAng);
            ctx.translate(0, -radius * 0.88);
            ctx.fillStyle = '#fff';
            ctx.shadowColor = '#fff';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.lineTo(6, 10);
            ctx.lineTo(-6, 10);
            ctx.fill();
            ctx.restore();
        }

        function drawCyberHand(ctx, pos, length, width, color) {
            ctx.save();
            ctx.rotate(pos);
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 15;
            ctx.shadowColor = color;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -length);
            ctx.stroke();
            ctx.restore();
        }
    </script>
</body>
</html>
